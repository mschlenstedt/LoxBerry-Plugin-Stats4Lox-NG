<style>
    .datahidden {
        display: none;
    }
    
    .small {
        font-size: 70%;
    }
    
    .bitsmall {
        font-size: 86%;
    }
    
    .grayed {
        color: gray;
    }
    
    .center {
        text-align: center;
    }
    
    .mono {
        font-family: 'Courier New', monospace;
        font-size: 85%;
    }
    
    .LoxoneDetails_table {
        min-width: 400px;
        width: 400px;
        border-collapse: collapse;
        border-bottom: 1px solid gray;
    }
    
    .LoxoneDetails_tr {
        padding: 2px 5px 2px 5px;
    }
    
    .LoxoneDetails_td {
        padding: 2px 5px 2px 5px;
        border-collapse: collapse;
        border-top: 1px solid gray;
        // border-bottom: 1px solid gray;
    }
    
    .controlstable {
        border-bottom: 1px solid gray;
        width: 100%;
    }
    
    .controlstable tr {
        padding: 2px 5px 2px 5px;
    }
    
    .controlstable td {
        padding: 2px 5px 2px 5px;
        border-collapse: collapse;
        border-top: 1px solid gray;
        /* border-bottom: 1px solid gray; */
    }
    
	.topicline {
		border-bottom: 1px solid gray;
		padding: 5px 5px 5px 5px;
	}

    .topicline:nth-of-type(odd) {
        background: #EEE
    }
    
    .topicline:nth-of-type(even) {
        background: #FFF
    }

	.topicerror { 
		color:red;
		font-size:85%;
	}

    .s4l_interval_highlight {
        background-color: #0059b3 !important;
        text-shadow: none !important;
        color: white !important;
    }
    
    .popuptitle {
        background-color: #6dac20;
        color: white;
        text-shadow: 1px 1px 2px black;
        padding: 5px;
    }
    
    #progressState {
        min-width: 200px;
        min-height: 70px;
    }
    
    .hintbox {
        background-color: #ffff73;
        padding: 15px;
        border: 1px solid gray;
    }
    
    .progress-border {
        border: 1px solid #ccc;
    }
    
    .progress-fill {
        background-color: #6dac20;
    }
    
    .mqttlivestate {
        padding: 4px;
    }
    
    /* Clipboard icon, drawn with CSS. The rule here used to point at
       images/clipboard_18.svg - a file this plugin never shipped, so the
       button showed an empty disc. Body from the border, clip from the
       box-shadow above it. */
    .ui-icon-clipboard:after,
    .ui-nosvg .ui-icon-clipboard:after {
        background-image: none;
        background-color: rgba(0,0,0,.3);
    }
    .ui-btn.ui-icon-clipboard:before {
        content: "";
        position: absolute;
        z-index: 1;
        width: 8px;
        height: 10px;
        border: 1px solid #fff;
        border-radius: 1px;
        box-shadow: 0 -3px 0 -1px #fff;
    }
    .ui-btn-icon-left.ui-icon-clipboard:before   { left: 0.95em; top: 50%; margin-top: -6px; }
    .ui-btn-icon-right.ui-icon-clipboard:before  { right: 1.35em; top: 50%; margin-top: -6px; }
    .ui-btn-icon-notext.ui-icon-clipboard:before { left: 50%; margin-left: -5px; top: 50%; margin-top: -6px; }
</style>

<div class="datahidden" id="mqttgateway_hostname"><TMPL_VAR MQTTGATEWAY_HOSTNAME></div>
<div class="datahidden" id="mqttgateway_udpinport"><TMPL_VAR MQTTGATEWAY_UDPINPORT></div>

<h3><TMPL_VAR MQTTCOLLECTOR.TITLE></h3>
<p><TMPL_VAR MQTTCOLLECTOR.DESCRIPTION></p>
<p><TMPL_VAR MQTTCOLLECTOR.HINT_TEXT_INTRO></p>
<p><TMPL_VAR MQTTCOLLECTOR.HINT_TEXT_PREREQ></p>
<p><TMPL_VAR MQTTCOLLECTOR.HINT_TEXT_HOWTO></p>
<p><TMPL_VAR MQTTCOLLECTOR.HINT_TEXT_JSON></p>
<p><TMPL_VAR MQTTCOLLECTOR.HINT_TEXT_OPTIONS></p>
<p><TMPL_VAR MQTTCOLLECTOR.HINT_TEXT_DIFFERENCE></p>

	<div style="display:none" id="isFinderAvailable"><TMPL_VAR FINDERAVAILABLE></div>

	<!-- Language strings for JavaScript -->
	<div class="datahidden" id="lang_placeholder_new"><TMPL_VAR MQTTCOLLECTOR.PLACEHOLDER_NEW></div>
	<div class="datahidden" id="lang_extract_numbers"><TMPL_VAR MQTTCOLLECTOR.LABEL_EXTRACT_NUMBERS></div>
	<div class="datahidden" id="lang_collect_strings"><TMPL_VAR MQTTCOLLECTOR.LABEL_COLLECT_STRINGS></div>
	<div class="datahidden" id="lang_button_add_line"><TMPL_VAR MQTTCOLLECTOR.BUTTON_ADD_LINE></div>
	<div class="datahidden" id="lang_button_save_apply"><TMPL_VAR COMMON.BUTTON_SAVE_APPLY></div>
	<div class="datahidden" id="lang_button_delete"><TMPL_VAR COMMON.BUTTON_DELETE></div>
	<div class="datahidden" id="lang_button_show"><TMPL_VAR MQTTCOLLECTOR.BUTTON_SHOW></div>
	<div class="datahidden" id="lang_error_invalid_topic"><TMPL_VAR MQTTCOLLECTOR.ERROR_INVALID_TOPIC></div>
	<div class="datahidden" id="lang_status_unsaved"><TMPL_VAR MQTTCOLLECTOR.STATUS_UNSAVED></div>
	<div class="datahidden" id="lang_status_saved"><TMPL_VAR MQTTCOLLECTOR.STATUS_SAVED></div>
	<div class="datahidden" id="lang_status_save_error"><TMPL_VAR MQTTCOLLECTOR.STATUS_SAVE_ERROR></div>
	<div class="datahidden" id="lang_button_hide"><TMPL_VAR COMMON.BUTTON_HIDE></div>
	<div class="datahidden" id="lang_sub_mqtt_collector"><TMPL_VAR NAVBAR.SUB_MQTT_COLLECTOR></div>
	<div class="datahidden" id="lang_sub_mqtt_live"><TMPL_VAR NAVBAR.SUB_MQTT_LIVE></div>
	
	<div id="subscriptionList">
	<div style="display:flex;flex-wrap:wrap">
		<div v-for="(subscription, index) in subscriptions" class="topicline" style="flex-basis:100%;width:100%" >
			
			<div style="display:flex;flex-wrap:wrap;">
				<div style="flex:10 1 0;">
					<input v-model="subscription.id" v-bind:placeholder="placeholderNew" v-on:input="validate(index, $event)">
				</div>
				<div style="padding:3px;flex:0 0;"> 
					<button data-mini="true" data-inline="true" v-on:click="this.subscriptions.splice(index, 1);this.errors.splice(index,1);changedMsg();">{{deleteLabel}}</button>
				</div>
				<div v-show="finderAvailable" style="padding:3px;flex:0 0;"> 
					<button data-mini="true" data-inline="true" v-on:click="openFinder(index)">{{showLabel}}</button>
				</div>
				
			</div>
			
			<div class="topicerror">{{errors[index]}}</div>
			
			<div style="display:flex;flex-wrap:wrap;">
				
				<div style="padding:3px;">
					<input type="checkbox" v-on:change="changedMsg();" v-model="subscription.extractNumbers" data-role="none"> {{extractNumbersLabel}}
				</div>
					
				<div style="padding:3px;">
					<input type="checkbox" data-role="none"
					v-on:change="changedMsg();" v-model="subscription.collectStrings"> {{collectStringsLabel}}
				</div>
			</div>
			
		</div>
	</div>
	<div style="height:12px;padding:3px" v-html="statusLine"></div>
	<button data-inline="true" v-on:click="subscriptions.push( {  } )">{{addLineLabel}}</button>
	<button data-inline="true" v-on:click="saveApply();">{{saveApplyLabel}}</button>
	</div>
