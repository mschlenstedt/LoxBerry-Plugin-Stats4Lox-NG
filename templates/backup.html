<style>
	.datahidden {
		display: none;
	}
	.chstatus
	{
		min-height	:4.0em;
		line-height	:1.2em;
		word-wrap	:break-word;
		width		:100%;
		text-align	:center;
	}
	.buttonrow
	{
		min-height	:2em;
		overflow	:auto;
		width		:100%;
		text-align	:center;
		font-size	:smaller;
	}

	/* Layout of a settings row.
	   .lb_flex-item-help from the LoxBerry stylesheet is 100% wide and
	   therefore always lands on a line of its own - starting at the very left,
	   below the label. Indenting it by the label column puts it under the field
	   it belongs to. Below 875px LoxBerry stacks the row into a single column,
	   so the indent has to disappear there - hence the media query. */
	.s4lrow
	{
		align-items	:flex-start;
		margin-bottom	:16px;
	}
	.s4lrow .lb_flex-item
	{
		min-width	:0;
		margin-top	:0;
	}
	.s4lrow .lb_flex-item-help
	{
		min-width	:0;
		position	:relative;
		margin-top	:6px;
	}
	@media ( min-width: 876px )
	{
		.s4lrow .lb_flex-item-label
		{
			min-width	:320px;
			width		:320px;
			max-width	:320px;
			margin-right	:10px;
			padding-top	:8px;
		}
		.s4lrow .lb_flex-item
		{
			flex		:1 1 0;
			width		:auto;
			max-width	:none;
			min-width	:0;
		}
		.s4lrow .lb_flex-item-help
		{
			width		:calc(100% - 330px);
			margin-left	:330px;
		}
	}
	/* Selects and text fields fill the field column.
	   The two margin resets are what this needs to work: jQuery Mobile gives
	   .ui-select a left and right margin of .3125em, so a box of width 100%
	   ends up 10px wider than its column - that was the part running off on
	   the right.
	   The flipswitch is deliberately left alone - jQuery Mobile builds it with
	   a fixed width and places the "off" label inside; any width of ours pushes
	   that label out of the switch. */
	.s4lrow .lb_flex-item .ui-select,
	.s4lrow .lb_flex-item .ui-input-text
	{
		width		:100%;
		margin-left	:0;
		margin-right	:0;
		box-sizing	:border-box;
	}

	/* Weekdays and time share one row. */
	.dayssplit
	{
		display		:flex;
		flex-wrap	:wrap;
		align-items	:center;
		gap		:16px;
	}
	.dayssplit .timepart
	{
		display		:flex;
		align-items	:center;
		gap		:8px;
	}
	.dayssplit .timepart label
	{
		margin		:0;
		white-space	:nowrap;
	}
	/* The two time lists keep their own narrow width - the 100% above is for
	   the fields that sit alone in their row. */
	.dayssplit .timepart .ui-select
	{
		width		:auto;
		min-width	:4.5em;
		margin		:0;
	}
	.dayssplit .timepart .timesep
	{
		font-weight	:bold;
		margin		:0 -4px;
	}
	/* jQuery Mobile 1.4.5 lays out a horizontal controlgroup as one row of
	   buttons. Seven weekdays fit on a desktop but not on a phone, so it is
	   allowed to wrap. */
	#weekdays.ui-controlgroup-horizontal .ui-controlgroup-controls
	{
		display		:flex;
		flex-wrap	:wrap;
	}

	table.backuplist
	{
		width		:100%;
		border-collapse	:collapse;
	}
	table.backuplist th, table.backuplist td
	{
		padding		:6px 8px;
		text-align	:left;
		border-bottom	:1px solid rgba(128,128,128,0.3);
		font-size	:smaller;
		vertical-align	:middle;
	}
	table.backuplist td.actions
	{
		white-space	:nowrap;
		text-align	:right;
	}

	/* The LoxBerry jQuery Mobile theme only has the swatches a, b and c, none
	   of them red. Destructive actions need to look destructive, so the plugin
	   brings its own. */
	.s4l-btn-danger.ui-btn
	{
		background-color:#c0392b;
		border-color	:#a93226;
		color		:#ffffff;
		text-shadow	:none;
	}
	.s4l-btn-danger.ui-btn:hover
	{
		background-color:#a93226;
		border-color	:#922b21;
		color		:#ffffff;
	}

	/* A note, and a warning that something is about to be deleted. */
	.warnbox
	{
		border		:1px solid #c0392b;
		padding		:8px;
		margin		:8px 0;
		border-radius	:4px;
	}
	.warnbox-danger
	{
		background-color:#c0392b;
		border-color	:#a93226;
		color		:#ffffff;
		font-weight	:bold;
	}
</style>

<div class="datahidden" id="lang_sub_system_settings"><TMPL_VAR NAVBAR.SUB_SYSTEM_SETTINGS></div>
<div class="datahidden" id="lang_sub_system_backup"><TMPL_VAR NAVBAR.SUB_SYSTEM_BACKUP></div>

<form>
<div class="ui-body ui-body-a ui-corner-all">

	<div class="lb_flex-container">
		<div	class="buttonrow">
			<a href="javascript:backupNow();" id="btnbackupnow" class="ui-btn ui-corner-all ui-shadow ui-btn-b ui-btn-icon-left ui-icon-plus ui-btn-inline"
				data-inline="true"><TMPL_VAR BACKUP.BUTTON_BACKUP_NOW></a>
		</div>
	</div>

	<h2><TMPL_VAR BACKUP.TITLE_SETTINGS></h2>

	<div class="lb_flex-container s4lrow">
		<div	class="lb_flex-item-label"><TMPL_VAR BACKUP.LABEL_STORAGEPATH></div>
		<div	class="lb_flex-item">
			<TMPL_VAR STORAGE_PATH>
		</div>
		<div	class="lb_flex-item-help hint"><TMPL_VAR BACKUP.HINT_STORAGEPATH></div>
	</div>

	<div class="lb_flex-container s4lrow">
		<div	class="lb_flex-item-label"><TMPL_VAR BACKUP.LABEL_KEEP></div>
		<div	class="lb_flex-item">
			<select name="keep" id="keep"><TMPL_VAR KEEP_OPTIONS></select>
		</div>
		<div	class="lb_flex-item-help hint"><TMPL_VAR BACKUP.HINT_KEEP></div>
	</div>

	<div class="lb_flex-container s4lrow">
		<div	class="lb_flex-item-label"><TMPL_VAR BACKUP.LABEL_COMPRESSION></div>
		<div	class="lb_flex-item">
			<select name="compression" id="compression"><TMPL_VAR COMPRESSION_OPTIONS></select>
		</div>
		<div	class="lb_flex-item-help hint"><TMPL_VAR BACKUP.HINT_COMPRESSION></div>
	</div>

	<h2><TMPL_VAR BACKUP.TITLE_SCHEDULE></h2>

	<div class="lb_flex-container s4lrow">
		<div	class="lb_flex-item-label"><TMPL_VAR BACKUP.LABEL_SCHEDULEACTIVE></div>
		<div	class="lb_flex-item">
			<input type="checkbox" data-role="flipswitch" name="scheduleactive" id="scheduleactive" <TMPL_VAR SCHEDULEACTIVE>>
		</div>
		<div	class="lb_flex-item-help hint"><TMPL_VAR BACKUP.HINT_SCHEDULEACTIVE></div>
	</div>

	<div class="lb_flex-container s4lrow schedulefields">
		<div	class="lb_flex-item-label"><TMPL_VAR BACKUP.LABEL_WEEKDAY></div>
		<div	class="lb_flex-item">
			<div class="dayssplit">
				<fieldset data-role="controlgroup" data-type="horizontal" id="weekdays">
					<input type="checkbox" name="mon" id="mon" <TMPL_VAR CHECKED_MON>><label for="mon"><TMPL_VAR BACKUP.MON></label>
					<input type="checkbox" name="tue" id="tue" <TMPL_VAR CHECKED_TUE>><label for="tue"><TMPL_VAR BACKUP.TUE></label>
					<input type="checkbox" name="wed" id="wed" <TMPL_VAR CHECKED_WED>><label for="wed"><TMPL_VAR BACKUP.WED></label>
					<input type="checkbox" name="thu" id="thu" <TMPL_VAR CHECKED_THU>><label for="thu"><TMPL_VAR BACKUP.THU></label>
					<input type="checkbox" name="fre" id="fre" <TMPL_VAR CHECKED_FRE>><label for="fre"><TMPL_VAR BACKUP.FRE></label>
					<input type="checkbox" name="sat" id="sat" <TMPL_VAR CHECKED_SAT>><label for="sat"><TMPL_VAR BACKUP.SAT></label>
					<input type="checkbox" name="sun" id="sun" <TMPL_VAR CHECKED_SUN>><label for="sun"><TMPL_VAR BACKUP.SUN></label>
				</fieldset>
				<!-- Hour and minute as two lists instead of <input type="time">.
				     The native field accepted letters here and showed no clock,
				     and there is nothing in jQuery Mobile 1.4.5 to fix that with
				     - it has no time widget of its own, LoxBerry ships no
				     extension, and it leaves type="time" untouched. Two lists
				     cannot take a wrong entry at all and give the hour/minute
				     scrolling this needs. -->
				<div class="timepart">
					<label for="timeh"><TMPL_VAR BACKUP.LABEL_TIME></label>
					<select name="timeh" id="timeh"><TMPL_VAR HOUR_OPTIONS></select>
					<span class="timesep">:</span>
					<select name="timem" id="timem"><TMPL_VAR MINUTE_OPTIONS></select>
				</div>
			</div>
		</div>
	</div>

	<div class="lb_flex-container s4lrow schedulefields">
		<div	class="lb_flex-item-label"><TMPL_VAR BACKUP.LABEL_REPEAT></div>
		<div	class="lb_flex-item">
			<select name="repeat" id="repeat"><TMPL_VAR REPEAT_OPTIONS></select>
		</div>
	</div>

	<div style="padding: 0px 0px 20px 0px;"></div>

	<div class="lb_flex-container backupsettings">
		<div	class="buttonrow">
			<a href="javascript:saveBackupConfig();" id="btnsavebackup" class="ui-btn ui-corner-all ui-shadow ui-btn-b ui-btn-icon-left ui-icon-check ui-btn-inline"
				data-inline="true"><TMPL_VAR COMMON.BUTTON_SAVE_APPLY></a>
		</div>
	</div>

	<div class="lb_flex-container">
		<div class="buttonrow" id="hint_backupsettings">&nbsp;</div>
	</div>

	<h2><TMPL_VAR BACKUP.TITLE_ARCHIVES></h2>

	<div id="backuplist"><p><TMPL_VAR BACKUP.HINT_LOADING></p></div>

	<div style="padding: 0px 0px 10px 0px;"></div>

	<div class="lb_flex-container">
		<div	class="buttonrow">
			<a href="javascript:loadBackups();" id="btnrefresh" class="ui-btn ui-corner-all ui-shadow ui-btn-icon-left ui-icon-refresh ui-btn-inline"
				data-inline="true"><TMPL_VAR BACKUP.BUTTON_REFRESH></a>
<TMPL_IF STORAGEPATH_SET>
			<a href="<TMPL_VAR FILEMANAGER_URL>" target="_blank" id="btnfilemanager" class="ui-btn ui-corner-all ui-shadow ui-btn-icon-left ui-icon-navigation ui-btn-inline"
				data-inline="true"><TMPL_VAR BACKUP.BUTTON_FILEMANAGER></a>
</TMPL_IF>
		</div>
	</div>

</div>
</form>

<!-- Progress while a backup or a restore runs -->
<div data-role="popup" id="popupProgress" data-position-to="window" data-transition="flip" data-theme="a" data-overlay-theme="a" data-dismissible="false" class="ui-content" style="min-width:300px;">
	<center><h2 id="progress_title">&nbsp;</h2></center>
	<div class="chstatus" id="progress_hint">&nbsp;</div>
	<div class="chstatus" id="progress_status">&nbsp;</div>
</div>

<!-- Restore has to be confirmed - it replaces the running installation -->
<div data-role="popup" id="popupRestore" data-position-to="window" data-transition="flip" data-theme="a" data-overlay-theme="a" data-dismissible="false" class="ui-content" style="max-width:600px;">
	<center><h2><TMPL_VAR BACKUP.CONFIRM_RESTORE_TITLE></h2></center>
	<div id="restore_detail"></div>
	<div style="padding: 10px 0px 0px 0px; text-align:center;">
		<a href="javascript:closeRestore();" class="ui-btn ui-corner-all ui-shadow ui-btn-inline" data-inline="true"><TMPL_VAR BACKUP.BUTTON_CANCEL></a>
		<a href="javascript:doRestore();" id="btndorestore" class="ui-btn ui-corner-all ui-shadow ui-btn-inline s4l-btn-danger" data-inline="true"><TMPL_VAR BACKUP.BUTTON_RESTORE_CONFIRM></a>
	</div>
</div>

<script>
var pollInterval;
var restoreFile;
var restoreForce = 0;
var restoreDbPath = "";

$(function() {
	toggleSchedule();
	$('#scheduleactive').on( 'change', toggleSchedule );
	loadBackups();
});

// The schedule fields say nothing while the schedule is off.
function toggleSchedule() {
	if( $('#scheduleactive').is(':checked') ) {
		$('.schedulefields').removeClass('ui-disabled');
	} else {
		$('.schedulefields').addClass('ui-disabled');
	}
}

function cb( id ) {
	return $('#'+id).is(':checked') ? 'True' : 'False';
}

function saveBackupConfig() {
	$('.backupsettings').addClass('ui-disabled');
	$('#hint_backupsettings').html("");
	$.ajax( {
		url:  'ajax.cgi',
		type: 'POST',
		data: {
			action:         'savebackupconfig',
			storagepath:    $('#storagepath').val(),
			keep:           $('#keep').val(),
			compression:    $('#compression').val(),
			scheduleactive: cb('scheduleactive'),
			timef:          $('#timeh').val() + ':' + $('#timem').val(),
			repeat:         $('#repeat').val(),
			mon: cb('mon'), tue: cb('tue'), wed: cb('wed'), thu: cb('thu'),
			fre: cb('fre'), sat: cb('sat'), sun: cb('sun')
		}
	} )
	.fail( function( data ) {
		console.log( "savebackupconfig failed", data );
		$('#hint_backupsettings').attr("style","color:red").html("<TMPL_VAR BACKUP.HINT_SAVING_FAIL>");
	} )
	.done( function( data ) {
		if( data && data.error == 0 ) {
			$('#hint_backupsettings').attr("style","color:green").html("<TMPL_VAR BACKUP.HINT_SAVING_SUCCESS>");
			loadBackups();
		} else {
			$('#hint_backupsettings').attr("style","color:red").html("<TMPL_VAR BACKUP.HINT_SAVING_FAIL>");
		}
	} )
	.always( function() {
		$('.backupsettings').removeClass('ui-disabled');
	} );
}

function esc( s ) {
	return $('<div>').text( s === undefined || s === null ? '' : s ).html();
}

function loadBackups() {
	$('#backuplist').html("<p><TMPL_VAR BACKUP.HINT_LOADING></p>");
	$.ajax( { url: 'ajax.cgi', type: 'POST', data: { action: 'backup_list' } } )
	.fail( function( data ) {
		console.log( "backup_list failed", data );
		$('#backuplist').html("<p><TMPL_VAR COMMON.ERROR_COULD_NOT_GET_DATA></p>");
	} )
	.done( function( data ) {
		if( !data || data.nostorage ) {
			$('#backuplist').html("<p><TMPL_VAR BACKUP.HINT_NO_STORAGE></p>");
			return;
		}
		var list = data.backups || [];
		if( list.length == 0 ) {
			$('#backuplist').html("<p><TMPL_VAR BACKUP.HINT_NO_ARCHIVES></p>");
			return;
		}
		var h = '<table class="backuplist"><thead><tr>'
		      + '<th><TMPL_VAR BACKUP.COL_NAME></th>'
		      + '<th><TMPL_VAR BACKUP.COL_DATE></th>'
		      + '<th><TMPL_VAR BACKUP.COL_SIZE></th>'
		      + '<th><TMPL_VAR BACKUP.COL_VERSION></th>'
		      + '<th></th></tr></thead><tbody>';
		$.each( list, function( i, b ) {
			var m = b.manifest || {};
			// Without a manifest the archive is not ours - it is listed so the
			// user sees what is lying there, but it cannot be restored.
			var created = m.created ? m.created : '-';
			var ver     = m.plugin_version ? m.plugin_version : '-';
			h += '<tr><td>' + esc(b.name) + '</td>'
			   + '<td>' + esc(created) + '</td>'
			   + '<td>' + esc(b.size_h) + '</td>'
			   + '<td>' + esc(ver) + '</td>'
			   + '<td class="actions">';
			if( m.created ) {
				h += '<a href="javascript:askRestore(\'' + esc(b.file) + '\');" class="ui-btn ui-mini ui-corner-all ui-btn-inline">'
				   + '<TMPL_VAR BACKUP.BUTTON_RESTORE></a> ';
			}
			h += '<a href="javascript:deleteBackup(\'' + esc(b.file) + '\');" class="ui-btn ui-mini ui-corner-all ui-btn-inline s4l-btn-danger">'
			   + '<TMPL_VAR BACKUP.BUTTON_DELETE></a>';
			h += '</td></tr>';
		} );
		h += '</tbody></table>';
		$('#backuplist').html(h);
	} );
}

function deleteBackup( file ) {
	if( !confirm("<TMPL_VAR BACKUP.CONFIRM_DELETE>") ) { return; }
	$.ajax( { url: 'ajax.cgi', type: 'POST', data: { action: 'backup_delete', file: file } } )
	.always( function() { loadBackups(); } );
}

function backupNow() {
	$('#progress_title').html("<TMPL_VAR BACKUP.POPUP_BACKUP_TITLE>");
	$('#progress_hint').attr("style","").html("<TMPL_VAR BACKUP.HINT_BACKUP_RUNNING>");
	$('#progress_status').html("");
	$('#popupProgress').popup('open');
	$.ajax( { url: 'ajax.cgi', type: 'POST', data: { action: 'backup_create' } } )
	.fail( function( data ) {
		console.log( "backup_create failed", data );
		finishProgress( false, "<TMPL_VAR BACKUP.HINT_BACKUP_FAIL>" );
	} )
	.done( function() {
		startPolling( "<TMPL_VAR BACKUP.HINT_BACKUP_DONE>", "<TMPL_VAR BACKUP.HINT_BACKUP_FAIL>" );
	} );
}

// Asks the backend first: is there room, and would an existing database with
// data be deleted? Only then is the confirmation shown - with the answer in it.
function askRestore( file ) {
	restoreFile = file;
	restoreForce = 0;
	restoreDbPath = "";
	$('#restore_detail').html("<p><TMPL_VAR BACKUP.HINT_LOADING></p>");
	$('#popupRestore').popup('open');
	$.ajax( { url: 'ajax.cgi', type: 'POST', data: { action: 'backup_check', file: file } } )
	.fail( function( data ) {
		console.log( "backup_check failed", data );
		$('#restore_detail').html("<p><TMPL_VAR COMMON.ERROR_COULD_NOT_GET_DATA></p>");
		$('#btndorestore').addClass('ui-disabled');
	} )
	.done( function( data ) {
		if( !data || !data.ok ) {
			var msg = ( data && data.error ) ? data.error : "<TMPL_VAR COMMON.ERROR_COULD_NOT_GET_DATA>";
			$('#restore_detail').html('<div class="warnbox">' + esc(msg) + '</div>');
			$('#btndorestore').addClass('ui-disabled');
			return;
		}
		restoreDbPath = data.chosen;
		restoreForce  = data.needs_confirmation ? 1 : 0;

		var h = '<p><TMPL_VAR BACKUP.CONFIRM_RESTORE></p>';
		h += '<p>' + "<TMPL_VAR BACKUP.HINT_RESTORE_TARGET>".replace('__PATH__', esc(data.chosen)) + '</p>';
		if( data.alternative ) {
			h += '<div class="warnbox">'
			   + "<TMPL_VAR BACKUP.HINT_RESTORE_ALTERNATIVE>".replace('__PATH__', esc(data.chosen))
			   + '</div>';
		}
		// A freshly created, empty database is what an installation leaves
		// behind - saying anything about it would only unsettle the user. Data
		// that is really about to be deleted gets the red box.
		if( data.needs_confirmation ) {
			h += '<div class="warnbox warnbox-danger">'
			   + "<TMPL_VAR BACKUP.CONFIRM_RESTORE_DB>".replace('__PATH__', esc(data.chosen))
			   + '</div>';
		}
		$.each( ( data.manifest && data.manifest.warnings ) || [], function( i, w ) {
			h += '<div class="warnbox">' + esc(w) + '</div>';
		} );
		$('#restore_detail').html(h);
		$('#btndorestore').removeClass('ui-disabled');
		$('#popupRestore').popup('reposition', { positionTo: 'window' } );
	} );
}

function closeRestore() {
	$('#popupRestore').popup('close');
}

function doRestore() {
	$('#popupRestore').popup('close');
	$('#progress_title').html("<TMPL_VAR BACKUP.POPUP_RESTORE_TITLE>");
	$('#progress_hint').attr("style","").html("<TMPL_VAR BACKUP.HINT_RESTORE_RUNNING>");
	$('#progress_status').html("");
	$('#popupProgress').popup('open');
	$.ajax( {
		url: 'ajax.cgi',
		type: 'POST',
		data: {
			action:  'backup_restore',
			file:    restoreFile,
			dbpath:  restoreDbPath,
			force:   restoreForce ? 'true' : 'false'
		}
	} )
	.fail( function( data ) {
		console.log( "backup_restore failed", data );
		finishProgress( false, "<TMPL_VAR BACKUP.HINT_RESTORE_FAIL>" );
	} )
	.done( function() {
		startPolling( "<TMPL_VAR BACKUP.HINT_RESTORE_DONE>", "<TMPL_VAR BACKUP.HINT_RESTORE_FAIL>" );
	} );
}

// The script writes its progress into a status file; this reads it every three
// seconds. A backup of a large database takes minutes, so there is no timeout -
// the popup stays until the script says it is done.
function startPolling( okmsg, failmsg ) {
	clearInterval( pollInterval );
	pollInterval = window.setInterval( function() {
		$.ajax( { url: 'ajax.cgi', type: 'POST', data: { action: 'backup_status' } } )
		.done( function( data ) {
			if( !data || data.running === undefined ) { return; }
			if( data.message ) {
				$('#progress_status').attr("style","color:blue").html( esc(data.message) );
			}
			if( !data.running ) {
				clearInterval( pollInterval );
				finishProgress( !data.errors, data.errors ? failmsg : okmsg );
			}
		} );
	}, 3000 );
}

function finishProgress( ok, msg ) {
	clearInterval( pollInterval );
	$('#progress_status').attr("style", ok ? "color:green" : "color:red").html( msg );
	window.setTimeout( function() {
		$('#popupProgress').popup('close');
		loadBackups();
	}, 3000 );
}

</script>
