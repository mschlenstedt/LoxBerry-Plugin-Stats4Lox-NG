<style>
	.datahidden {
		display: none;
	}
	.chstatus
	{	
		min-height	:4.0em;
		line-height	:1.2em;
		word-wrap	:break-word;
		width		:100%;
		text-align	:center;
	}
	.buttonrow
	{	
		min-height	:2em;
		overflow	:auto;
		width		:100%;
		text-align	:center;
		font-size	:smaller;
	}
	.ui-popup-container
	{
		width:  40%;
		height: 30%;
	}

	/* Layout of a settings row.
	   .lb_flex-item-help from the LoxBerry stylesheet is 100% wide and
	   therefore always lands on a line of its own - starting at the very left,
	   below the label. Indenting it by the label column puts it under the field
	   it belongs to. Below 875px LoxBerry stacks the row into a single column,
	   so the indent has to disappear there - hence the media query. */
	.s4lrow
	{
		align-items	:flex-start;
		margin-bottom	:16px;
	}
	.s4lrow .lb_flex-item
	{
		min-width	:0;
		margin-top	:0;
	}
	.s4lrow .lb_flex-item-help
	{
		min-width	:0;
		position	:relative;
		margin-top	:6px;
	}
	@media ( min-width: 876px )
	{
		.s4lrow .lb_flex-item-label
		{
			min-width	:320px;
			width		:320px;
			max-width	:320px;
			margin-right	:10px;
			padding-top	:8px;
		}
		.s4lrow .lb_flex-item
		{
			flex		:1 1 0;
			width		:auto;
			max-width	:none;
			min-width	:0;
		}
		.s4lrow .lb_flex-item-help
		{
			width		:calc(100% - 330px);
			margin-left	:330px;
		}
	}
	/* Selects and text fields fill the field column.
	   The two margin resets are what this needs to work: jQuery Mobile gives
	   .ui-select a left and right margin of .3125em, so a box of width 100%
	   ends up 10px wider than its column - that was the part running off on
	   the right.
	   The flipswitch is deliberately left alone - jQuery Mobile builds it with
	   a fixed width and places the "off" label inside; any width of ours pushes
	   that label out of the switch. */
	.s4lrow .lb_flex-item .ui-select,
	.s4lrow .lb_flex-item .ui-input-text
	{
		width		:100%;
		margin-left	:0;
		margin-right	:0;
		box-sizing	:border-box;
	}

	/* SecurePIN gate, laid out like the LoxBerry MQTT widget so the dialog looks
	   the same wherever it appears. */
	#securepin_block .path
	{
		background	:#e6e6e6;
		border		:1px solid #7e7e7e;
		border-radius	:4px;
		padding		:10px;
	}
	#securepin_block .hint { font-size:smaller; }
	#securepin_block .warnbox
	{
		background	:#FF8080;
		color		:#000000;
		text-shadow	:none;
		border		:1px solid #000000;
		border-radius	:4px;
		padding		:5px;
		width		:300px;
	}
	/* The password field and the reveal button next to each other */
	.passwordrow
	{
		display		:flex;
		flex-wrap	:wrap;
		align-items	:center;
		gap		:8px;
	}
	.passwordrow .ui-input-text { flex:1; min-width:180px; margin:0; }

	/* A plain value in the field column. The label carries a padding-top to line
	   up with the form controls next to it, so a bare span needs the same or it
	   sits higher than its own label. */
	.fieldvalue { display:inline-block; padding-top:8px; }
	.mono { font-family:monospace; }

	/* Square icon button, same style as the ones in the tables - jQuery Mobile
	   would put the glyph on a round grey disc. */
	.s4l-tbtn
	{
		display		:inline-block;
		width		:26px;
		height		:26px;
		border-radius	:3px;
		border		:1px solid #7e7e7e;
		background	:#f6f6f6;
		position	:relative;
		vertical-align	:middle;
		box-sizing	:border-box;
		cursor		:pointer;
		font-size	:0;
		line-height	:0;
		flex		:0 0 auto;
	}
	.s4l-tbtn:hover { background:#e6e6e6; }

	/* Eye: an almond from two different corner radii, with a pupil. The slash
	   appears while the password is visible, so the button shows what pressing
	   it will do next. */
	.s4l-tbtn-eye::before
	{
		content		:"";
		position	:absolute;
		left		:3px;
		top		:7px;
		width		:18px;
		height		:11px;
		border		:2px solid #3a3a3a;
		border-radius	:50% 50% 50% 50% / 60% 60% 40% 40%;
		box-sizing	:border-box;
	}
	.s4l-tbtn-eye::after
	{
		content		:"";
		position	:absolute;
		left		:10px;
		top		:10px;
		width		:5px;
		height		:5px;
		border-radius	:50%;
		background	:#3a3a3a;
	}
	.s4l-tbtn-eye.revealed > .slash
	{
		position	:absolute;
		left		:2px;
		top		:11px;
		width		:22px;
		height		:2px;
		background	:#c0392b;
		transform	:rotate(-35deg);
		z-index		:1;
	}
</style>

<script>
// globals
var chstatusorig;
var chstatus;
var interval;

// Validation
validate_enable('#GrafanaPort');

// getconfig() is NOT called here any more - nothing is fetched before the
// SecurePIN has been confirmed, see checkSecurePIN().

// --- SecurePIN ------------------------------------------------------------
//
// Same flow as the LoxBerry MQTT widget: the PIN is kept in sessionStorage, so
// moving between the tabs of this plugin does not ask again, while a new browser
// session does. The endpoints that hand out or change the password verify the
// PIN themselves - what happens here only decides what is shown.
$(function() {
	$("#check_securepin").click(function() {
		checkSecurePIN();
		return false;
	});
	$('#securepin').val( sessionStorage.getItem("securePIN") );
	if( $('#securepin').val() ) {
		$('#check_securepin').trigger("click");
	} else {
		$("#securepin_block").fadeIn();
	}
});

function checkSecurePIN() {
	$("#check_securepin").attr("disabled", true);
	$("#check_hint").attr("style", "color:blue;").html("<TMPL_VAR SECUREPIN.CHECK_WAIT>");
	$.ajax({
		type: 'POST',
		data: { action: 'checksecpin', secpin: $('#securepin').val() }
	})
	.fail(function(data) {
		$("#securepin_block").fadeIn();
		$("#check_hint").attr("style", "color:red").html("<TMPL_VAR SECUREPIN.ERROR_GENERIC>: " + data.statusText);
	})
	.done(function(data) {
		if( data.error && data.error != 0 ) {
			var msg = "<TMPL_VAR SECUREPIN.ERROR_WRONG>";
			if( data.error == 2 ) msg = "<TMPL_VAR SECUREPIN.ERROR_OPEN>";
			if( data.error == 3 ) msg = "<TMPL_VAR SECUREPIN.ERROR_LOCKED>";
			$("#securepin_block").fadeIn();
			$("#check_hint").attr("style", "color:red").html(msg);
			return;
		}
		sessionStorage.setItem("securePIN", $('#securepin').val());
		$("#securepin_block").fadeOut();
		$("#main_content").css('visibility', 'visible');
		// Only now is anything loaded.
		getconfig();
		getCredentials();
	})
	.always(function() {
		$("#check_securepin").attr("disabled", false);
	});
}

function AddKeyPress(event, submitobj) {
	event = event || window.event;
	if( event.keyCode == 13 ) {
		submitobj.click();
		return false;
	}
	return true;
}

// --- InfluxDB credentials (issue #45) -------------------------------------

var currentPassword = "";

function getCredentials() {
	$.post( "ajax.cgi", { action: 'influx_getcred', secpin: sessionStorage.getItem("securePIN") } )
	.fail( function( data ) { console.log( "influx_getcred failed", data ); } )
	.done( function( data ) {
		if( !data || data.error ) { console.log( "influx_getcred", data ); return; }
		$('#influxuser').text( data.user );
		currentPassword = data.password;
		$('#influxpass').val( data.password );
		try { $('#influxpass').textinput("refresh"); } catch(e) {}
	} );
}

// The button carries no text, so what it does lives in the title - and the eye
// gets a slash while the password is on screen.
function togglePassword() {
	var f = $('#influxpass');
	var b = $('#btntogglepassword');
	if( f.attr("type") == "password" ) {
		f.attr("type", "text");
		b.addClass("revealed").html('<span class="slash"></span>')
		 .attr("title", $('#lang_hide_password').text())
		 .attr("aria-label", $('#lang_hide_password').text());
	} else {
		f.attr("type", "password");
		b.removeClass("revealed").html("")
		 .attr("title", $('#lang_show_password').text())
		 .attr("aria-label", $('#lang_show_password').text());
	}
}

// The change runs in the background - the fallback route stops and starts
// InfluxDB, which takes a while. Rather than inventing a status channel, the
// page polls the credentials until the stored password differs from the one it
// started with: that is the proof the change went through, not just that some
// script reported success.
function changePassword( generate ) {
	var pw = generate ? "" : $('#influxpass').val();
	if( !generate ) {
		if( pw.length < 8 || /['"\\\s]/.test(pw) ) {
			$("#hint_credentials").attr("style","color:red").html( $('#lang_password_fail').text() );
			return;
		}
		if( pw == currentPassword ) return;
	}

	$(".credentials").addClass('ui-disabled');
	$("#hint_credentials").attr("style","color:blue").html( $('#lang_password_changing').text() );

	$.post( "ajax.cgi", {
		action: 'influx_setpassword',
		secpin: sessionStorage.getItem("securePIN"),
		password: pw
	} )
	.fail( function( data ) {
		console.log( "influx_setpassword failed", data );
		$("#hint_credentials").attr("style","color:red").html( $('#lang_password_fail').text() );
		$(".credentials").removeClass('ui-disabled');
	} )
	.done( function( data ) {
		if( !data || data.error ) {
			$("#hint_credentials").attr("style","color:red").html( data && data.error ? data.error : $('#lang_password_fail').text() );
			$(".credentials").removeClass('ui-disabled');
			return;
		}
		var before = currentPassword;
		var tries = 0;
		var poll = window.setInterval( function() {
			tries++;
			$.post( "ajax.cgi", { action: 'influx_getcred', secpin: sessionStorage.getItem("securePIN") } )
			.done( function( d ) {
				if( d && d.password && d.password != before ) {
					window.clearInterval( poll );
					currentPassword = d.password;
					$('#influxpass').val( d.password );
					try { $('#influxpass').textinput("refresh"); } catch(e) {}
					$("#hint_credentials").attr("style","color:green").html( $('#lang_password_changed').text() );
					$(".credentials").removeClass('ui-disabled');
				}
			} );
			// 90 seconds: the fallback route restarts InfluxDB twice, which on a
			// Raspberry is not quick.
			if( tries > 45 ) {
				window.clearInterval( poll );
				$("#hint_credentials").attr("style","color:red").html( $('#lang_password_fail').text() );
				$(".credentials").removeClass('ui-disabled');
			}
		}, 2000 );
	} );
}


// Save Settings: Output Influx
function saveOutputInflux() {
	console.log ("Saving Influx settings");
	$(".influx").addClass('ui-disabled');
	$("#hint_influx").html("");
	$.ajax( { 
			url:     'ajax.cgi',
			type:    'POST',
			data: { 
				action: 'savepluginconfig', 
				section: 'influx', 
				influx_db_storage: $('#influxstoragepath').val()
			}
		} )
	.fail(function( data ) {
		console.log( "Saving Influx Fail:", data );
		$("#hint_influx").attr("style", "color:red").html("<TMPL_VAR INPUTSOUTPUTS.HINT_SAVING_FAIL>");
	})
	.done(function( data ) {
		console.log( "Saving Influx Success: ", data );
		section = "influx";
		$("#ch_status").attr("style", "color:blue").html("<TMPL_VAR INPUTSOUTPUTS.HINT_SAVING_PREPARING>");
		$( "#popupSave" ).popup( "open" )
		interval = window.setInterval( function(){ checkconfighandlerstatus(section); }, 3000);
	})
	.always(function( data ) {
		console.log( "Saving Influx Finished" );
	});
}

function saveServiceLog() {
	console.log ("Saving service logging setting");
	$(".servicelog").addClass('ui-disabled');
	$("#hint_servicelog").html("");
	$.ajax( {
			url:     'ajax.cgi',
			type:    'POST',
			data: {
				action: 'savepluginconfig',
				section: 'servicelog',
				servicelogging: $('#servicelogging').is(':checked') ? 'true' : 'false'
			}
		} )
	.fail(function( data ) {
		console.log( "Saving service logging Fail:", data );
		$("#hint_servicelog").attr("style", "color:red").html("<TMPL_VAR INPUTSOUTPUTS.HINT_SAVING_FAIL>");
	})
	.done(function( data ) {
		console.log( "Saving service logging Success: ", data );
		section = "servicelog";
		$("#ch_status").attr("style", "color:blue").html("<TMPL_VAR INPUTSOUTPUTS.HINT_SAVING_PREPARING>");
		$( "#popupSave" ).popup( "open" )
		interval = window.setInterval( function(){ checkconfighandlerstatus(section); }, 3000);
	});
}

function checkconfighandlerstatus( section ) {
	console.log ("Checking Config-Handler Status for section " + section);
	$.ajax( { 
			url:     'ajax.cgi',
			type:    'POST',
			data: { 
				action: 'config-handler-status', 
				section: 'influx', 
			}
		} )
	.fail(function( data ) {
		console.log( "Checking Config-Handler Status Fail:", data );
		$("#hint_"+section).attr("style", "color:red").html("<TMPL_VAR INPUTSOUTPUTS.HINT_SAVING_FAIL>");
		$("#ch_status").html("");
		$("."+section).removeClass('ui-disabled');
		$( "#popupSave" ).popup( "close" )
	})
	.done(function( data ) {
		console.log( "Checking Config-Handler Status Success: ", data );
		if ( data.global.running ) {
			if (data[section].message != chstatusorig) {
				chstatus = data[section].message + "<br><br>";
				chstatusorig = data[section].message;
			} else {
				chstatus = chstatus + "&#9609;";
			}

			$("#ch_status").attr("style", "color:blue").html(chstatus);
		} else {
			if (data[section].errors > 0) {
				// The guard stays even though the config handler writes a log
				// again: the link is only worth showing when there really is a
				// file behind it, and previously it was built unconditionally.
				var errmsg = "<TMPL_VAR INPUTSOUTPUTS.HINT_SAVING_ERROR>";
				if( data.global.logfile ) {
					errmsg += " <a href='/admin/system/tools/logfile.cgi?logfile=" + data.global.logfile + "&header=html&format=template&only=once' target='_blank'><TMPL_VAR INPUTSOUTPUTS.HINT_OPEN_LOGFILE></a>";
				}
				$("#hint_"+section).attr("style", "color:red").html(errmsg);
			} else {
				$("#hint_"+section).attr("style", "color:green").html("<TMPL_VAR INPUTSOUTPUTS.HINT_SAVING_SUCCESS>");
			}
			$("#ch_status").attr("style", "color:blue").html("");
			$("."+section).removeClass('ui-disabled');
			$( "#popupSave" ).popup( "close" )
			clearInterval(interval);
		}


	})
	.always(function( data ) {
		console.log( "Checking Config-Handler Finished" );
	});
}

// Get Config
function getconfig() {
	// Get Config
	
	console.log( "Get Config" );
	// Ajax request
	$.ajax({ 
		url:  'ajax.cgi',
		type: 'POST',
		data: { action: 'getpluginconfig' }
	})
	.fail(function( data ) {
		console.log( "getconfig Fail", data );
	})
	.done(function( data ) {
		console.log( "getconfig Success", data );
		// Fill the form with json data retrieved from the ajax getconfig call
		if ( jQuery.isEmptyObject(data)) {
			console.log("config is empty, does not exist or is invalid.");
		}
		if(data.influx.db_storage) {
