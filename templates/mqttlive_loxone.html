<style>
    .datahidden {
        display: none;
    }
    
    .small {
        font-size: 70%;
    }
    
    .bitsmall {
        font-size: 86%;
    }
    
    .grayed {
        color: gray;
    }
    
    .center {
        text-align: center;
    }
    
    .mono {
        font-family: 'Courier New', monospace;
        font-size: 85%;
    }
    
    .LoxoneDetails_table {
        min-width: 400px;
        width: 400px;
        border-collapse: collapse;
        border-bottom: 1px solid gray;
    }
    
    .LoxoneDetails_tr {
        padding: 2px 5px 2px 5px;
    }
    
    .LoxoneDetails_td {
        padding: 2px 5px 2px 5px;
        border-collapse: collapse;
        border-top: 1px solid gray;
        // border-bottom: 1px solid gray;
    }
    
    .controlstable {
        border-bottom: 1px solid gray;
        width: 100%;
    }
    
    .controlstable tr {
        padding: 2px 5px 2px 5px;
    }
    
    .controlstable td {
        padding: 2px 5px 2px 5px;
        border-collapse: collapse;
        border-top: 1px solid gray;
        /* border-bottom: 1px solid gray; */
    }
    
    tr:nth-child(even).controlstable_tr {
        background: #EEE
    }
    
    tr:nth-child(odd).controlstable_tr {
        background: #FFF
    }
    
    .s4l_interval_highlight {
        background-color: #0059b3 !important;
        text-shadow: none !important;
        color: white !important;
    }
    
    .popuptitle {
        background-color: #6dac20;
        color: white;
        text-shadow: 1px 1px 2px black;
        padding: 5px;
    }
    
    #progressState {
        min-width: 200px;
        min-height: 70px;
    }
    
    .hintbox {
        background-color: #ffff73;
        padding: 15px;
        border: 1px solid gray;
    }
    
    .progress-border {
        border: 1px solid #ccc;
    }
    
    .progress-fill {
        background-color: #6dac20;
    }
    
    .mqttlivestate {
        padding: 4px;
    }
    
    /* Clipboard icon, drawn with CSS. The rule here used to point at
       images/clipboard_18.svg - a file this plugin never shipped, so the
       button showed an empty disc. Body from the border, clip from the
       box-shadow above it. */
    .ui-icon-clipboard:after,
    .ui-nosvg .ui-icon-clipboard:after {
        background-image: none;
        background-color: rgba(0,0,0,.3);
    }
    .ui-btn.ui-icon-clipboard:before {
        content: "";
        position: absolute;
        z-index: 1;
        width: 8px;
        height: 10px;
        border: 1px solid #fff;
        border-radius: 1px;
        box-shadow: 0 -3px 0 -1px #fff;
    }
    .ui-btn-icon-left.ui-icon-clipboard:before   { left: 0.95em; top: 50%; margin-top: -6px; }
    .ui-btn-icon-right.ui-icon-clipboard:before  { right: 1.35em; top: 50%; margin-top: -6px; }
    .ui-btn-icon-notext.ui-icon-clipboard:before { left: 50%; margin-left: -5px; top: 50%; margin-top: -6px; }
</style>
