<script type="text/javascript" src="./js/home.js"></script>

<style>
.datahidden {
	display:none;
}

.small {
	font-size:70%;
}

.middle {
	font-size:120%;
}

.bold {
	font-weight: bold;
}

.grayed {
	color: gray;
}

.center {
	text-align: center;
}

.grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
	grid-column-gap: 15px;
	grid-row-gap: 15px;
}
.box {
	border: 1px solid black;
	display: flex;
	flex-direction: column;
}

/* The service descriptions differ in length. Without this the status line and
   the buttons below it started at a different height in every box, so they no
   longer lined up across a row. The grid already stretches all boxes of a row
   to the same height - the description simply takes up whatever slack is left,
   which puts everything below it at the same height everywhere. */
.box .desc {
	flex: 1 1 auto;
}

/* The Grafana panels used to sit in <object> elements without a height
   attribute, which makes them 150px tall - the browser default. That is not
   enough for a panel with a title, an axis and a legend: the content did not
   shrink to fit, it was simply cut off, so only the top left corner was
   visible. */
.box iframe.panel {
	display: block;
	width: 100%;
	height: 300px;
	border: 0;
}

.margin {
	margin: 10px;
}

.status {
	padding: 10px;
	box-sizing: border-box;
	border-radius: 5px 5px 5px 5px;
	margin: 10px;
	background: #dfdfdf;
	border: 1px solid #7E7E7E;
}

</style>

<!-- Language strings for JavaScript -->

<div class="datahidden" id="lang_status_error"><TMPL_VAR COMMON.STATUS_ERROR></div>
<div class="datahidden" id="lang_button_restart"><TMPL_VAR COMMON.BUTTON_RESTART></div>
<div class="datahidden" id="lang_button_stop"><TMPL_VAR COMMON.BUTTON_STOP></div>
<div class="datahidden" id="lang_label_ok"><TMPL_VAR COMMON.LABEL_OK></div>
