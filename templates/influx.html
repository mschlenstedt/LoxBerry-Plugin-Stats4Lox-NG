<style>
.datahidden { display:none; }
.small      { font-size:70%; }
.grayed     { color:gray; }

/* Table, filters and icons follow the Loxone page so both look like one
   plugin. Kept local to this template rather than shared, because the two
   pages have different columns. */
.influxtable {
	border-bottom: 1px solid gray;
	width: 100%;
	table-layout: fixed;
}
.influxtable th.col-name   { width: 26%; }
.influxtable th.col-source { width: 11%; }
.influxtable th.col-status { width: 6%;  }
.influxtable th.col-fields { width: 13%; }
.influxtable th.col-first  { width: 14%; }
.influxtable th.col-last   { width: 14%; }
.influxtable th.col-count  { width: 10%; }
.influxtable th.col-btn    { width: 6%;  }

.influxtable tr { padding: 2px 5px; }
.influxtable td {
	padding: 2px 5px;
	border-collapse: collapse;
	border-top: 1px solid gray;
	vertical-align: top;
	overflow-wrap: break-word;
	word-break: break-word;
}
.influxtable td.actionbuttons { text-align:right; white-space:nowrap; vertical-align:middle; }
.influxtable td.center { text-align:center; }
tr:nth-child(even).influxtable_tr { background:#EEE }
tr:nth-child(odd).influxtable_tr  { background:#FFF }

.influxtable th.s4l-sortable { cursor:pointer; user-select:none; }
.influxtable th.s4l-sortable:hover { text-decoration:underline; }
.influxtable th .sortarrow { opacity:0.35; padding-left:3px; }
.influxtable th.sortactive .sortarrow { opacity:1; }

/* Icons, drawn with CSS - same set as on the Loxone page. */
.s4l-icon {
	display:inline-block;
	width:18px; height:18px;
	border-radius:3px;
	position:relative;
	vertical-align:middle;
	box-sizing:border-box;
}
.s4l-icon-ok { background-color:#3c9a3c; }
.s4l-icon-ok::after {
	content:""; position:absolute; left:6px; top:3px;
	width:5px; height:9px;
	border:solid #ffffff; border-width:0 2px 2px 0;
	transform:rotate(45deg);
}
.s4l-icon-err { background-color:#c0392b; }
.s4l-icon-err::before, .s4l-icon-err::after {
	content:""; position:absolute; left:8px; top:3px;
	width:2px; height:12px; background-color:#ffffff;
}
.s4l-icon-err::before { transform:rotate(45deg); }
.s4l-icon-err::after  { transform:rotate(-45deg); }
.s4l-icon-warn {
	width:0; height:0; border-radius:0;
	border-left:9px solid transparent;
	border-right:9px solid transparent;
	border-bottom:16px solid #e0a800;
}
.s4l-icon-warn::before {
	content:""; position:absolute; left:-1px; top:5px;
	width:2px; height:5px; background-color:#4a3b00;
}
.s4l-icon-warn::after {
	content:""; position:absolute; left:-1px; top:12px;
	width:2px; height:2px; border-radius:50%; background-color:#4a3b00;
}
/* Grey badges that carry a word instead of a drawn symbol: "Off" for a
   statistic that is switched off, "?" for a measurement whose origin cannot be
   determined. A shape would have to be invented for both, and a shape nobody
   recognises explains less than two letters. */
.s4l-icon-label {
	width:auto;
	min-width:18px;
	padding:0 4px;
	background-color:#9a9a9a;
	color:#ffffff;
	font-size:10px;
	font-weight:bold;
	line-height:18px;
	text-align:center;
	font-family:sans-serif;
}

/* Square buttons of our own - jQuery Mobile puts an icon-only glyph on a round
   grey disc, which looks out of place in a table of square cells. */
.s4l-tbtn {
	display:inline-block;
	width:26px; height:26px;
	border-radius:3px;
	border:1px solid #7e7e7e;
	background:#e6e6e6;
	position:relative;
	vertical-align:middle;
	margin:0 0 0 4px;
	box-sizing:border-box;
	cursor:pointer;
	font-size:0;
	line-height:0;
}
.s4l-tbtn:hover { background:#d5d5d5; }
.s4l-tbtn-danger { background:#c0392b; border-color:#a93226; }
.s4l-tbtn-danger:hover { background:#a93226; }
.s4l-tbtn-cross::before, .s4l-tbtn-cross::after {
	content:""; position:absolute; left:11px; top:5px;
	width:2px; height:14px; background:#ffffff;
}
.s4l-tbtn-cross::before { transform:rotate(45deg); }
.s4l-tbtn-cross::after  { transform:rotate(-45deg); }
/* Reset arrow, the same one the Loxone page uses for the status reset: an open
   circle with an arrow head, drawn from two pseudo elements. */
.s4l-tbtn-reset::before {
	content:""; position:absolute;
	left:6px; top:6px; width:12px; height:12px;
	border:2px solid #3a3a3a; border-radius:50%;
	border-top-color:transparent;
}

/* The reset button of the filter row.

   Its own element in the layout, and deliberately not wrapped in a fieldset the
   way the filter groups are. The row is a flex container with
   align-items:flex-end, so everything hangs from the bottom edge - which is
   right for controls that share a baseline, and wrong for this one: as soon as a
   filter group wraps into two lines on a narrow screen, the button ended up at
   the very bottom next to the last line. align-self:center keeps it in the
   middle of however tall the row becomes, which is also what it means: it
   applies to every group, not to the one it happens to stand next to.

   Twice the usual gap to the left for the same reason.

   Square, and as tall as the filter controls of this page (measured: 40px). The glyph is drawn from the centre, so the size can change
   without touching it. */
.s4l-resetfilterwrap {
	padding: 5px;
	margin-left: 10px;
	/* No align-self of its own: it takes flex-end from the row, exactly like
	   every filter group, and so its bottom edge sits on the same line as the
	   dropdowns.

	   Centring was tried and looked wrong. A group is a caption plus its
	   controls, and centring counts the caption in - the button came out about
	   half a caption too high. Correcting that with a fixed offset does not work
	   either: those captions are one or two lines tall depending on how the row
	   breaks.

	   The wrapped case needs nothing extra. Once the row breaks, the button is
	   alone on its line, and a line is exactly as tall as what stands in it -
	   bottom, middle and top are then the same place.

	   The button sits in the same controlgroup its neighbours use, only without
	   a legend. That is not decoration: jQuery Mobile gives a controlgroup a
	   bottom margin of its own, and a bare div came out seven pixels lower than
	   every dropdown. Copying the container is more durable than copying the
	   seven pixels. */
}
.s4l-resetbtn {
	display: block;
	position: relative;
	box-sizing: border-box;
	/* Square, and as tall as the filter controls beside it. The height is
	   written down rather than derived: with the theme's padding removed -
	   which it has to be, or the box comes out oblong - there is nothing
	   left for it to derive from. Leaves the button a rounding step below
	   its neighbours, whose 39.75 rounds up to the same 40. */
	width: 40px;
	height: 40px;
	padding: 0 !important;
	margin: 0 !important;
}
.s4l-resetbtn::before {
	content:""; position:absolute;
	left:50%; top:50%; width:12px; height:12px; margin:-8px 0 0 -8px;
	border:2px solid #3a3a3a; border-radius:50%;
	border-top-color:transparent;
}
.s4l-resetbtn::after {
	content:""; position:absolute;
	left:50%; top:50%; width:0; height:0; margin:-9px 0 0 2px;
	border-left:4px solid transparent;
	border-right:4px solid transparent;
	border-bottom:5px solid #3a3a3a;
}
.s4l-tbtn-reset::after {
	content:""; position:absolute;
	left:15px; top:4px; width:0; height:0;
	border-left:4px solid transparent;
	border-right:4px solid transparent;
	border-bottom:5px solid #3a3a3a;
}
/* Magnifier for "count the values of this one" */
.s4l-tbtn-count::before {
	content:""; position:absolute; left:5px; top:5px;
	width:10px; height:10px;
	border:2px solid #3a3a3a; border-radius:50%;
}
.s4l-tbtn-count::after {
	content:""; position:absolute; left:15px; top:15px;
	width:6px; height:2px; background:#3a3a3a;
	transform:rotate(45deg);
}

/* Filter row, same height for every group - see the Loxone page for why the
   buttons are made a little taller than the text needs. */
.s4l-filtergroup label.ui-btn { line-height:21px; min-height:21px; }
.filter_icon { display:inline-block; height:21px; line-height:21px; vertical-align:top; }
.filter-highlight { background-color:#ffff99 !important; }

/* The line between the search field and the table. It belongs to the search
   above it, not to the table below - hence the clear gap underneath. */
.s4l-summary {
	padding:5px;
	margin-bottom:14px;
}

/* The search field: magnifier, text position and the clear button
   =============================================================================
   jQuery Mobile builds this field in the browser: a wrapper <div
   class="ui-input-search"> that carries the border, draws the magnifier as its
   :after and holds an <a class="ui-input-clear"> for emptying it.

   On LoxBerry 4 that falls apart, and the reason is the load order in
   templates/system/head.html: the design system CSS comes AFTER jQuery Mobile.
   components.css then styles every bare input, including ours:

       .lb-content input[type="search"] { padding: 8px 12px;
                                          border: 1px solid ...;
                                          background: var(--lb-input-bg); }

   while jQuery Mobile expects exactly the opposite for this input:

       .ui-input-search input { border: 0; background: transparent none; }

   So the input turns into an opaque box filling the wrapper: it covers the
   magnifier, its text starts at 12px right at the edge, and the clear button
   loses the ground it was drawn on.

   Deliberately NOT solved by making the input transparent again. The yellow
   highlight for an active search sits on the input itself
   (influx.js: $('#filter_search').addClass('filter-highlight')), and a
   transparent background would take it with it. Instead the two decorations are
   lifted above the input and the text is given room.

   The cross is drawn here rather than taken from the icon font: the disc that
   jQuery Mobile's icons need comes from its theme, which LoxBerry 4 does not
   supply - that is why the button appeared as a white square or not at all.
   Same reason the clipboard icon further down is drawn by hand. */

.ui-input-search:after { z-index: 2; }

/* No [type="search"] in this selector: jQuery Mobile rewrites the attribute to
   type="text" while enhancing the widget - measured in the browser, the input
   ends up as <input type="text"> inside .ui-input-search. That is also why the
   rule that bites is components.css's one for input[type="text"], and why an
   override written against [type="search"] never applies. */
.lb-content .ui-input-search input,
.ui-input-search input { padding-left: 26px !important; }

.ui-input-search .ui-btn.ui-input-clear {
	z-index: 2;
	width: 22px;
	height: 22px;
	margin: -11px .3125em 0 !important;
	background: transparent !important;
	border: 0 !important;
	box-shadow: none !important;
}
/* One glyph instead of two rotated bars. The bars depended on the pseudo
   elements keeping their size, position AND transform against whatever jQuery
   Mobile and the design system declare for the same selectors; a plain "✕" only
   has to be a character. font-size and text-indent have to be restored
   explicitly - .ui-btn-icon-notext sets them to hide the button's own label
   ("clear text"), and a pseudo element inherits both. */
.ui-input-search .ui-btn.ui-input-clear:before { content: none !important; }
.ui-input-search .ui-btn.ui-input-clear:after {
	content: "\2715" !important;
	position: absolute;
	left: 0 !important;
	top: 0 !important;
	width: 22px !important;
	height: 22px !important;
	margin: 0 !important;
	background: none !important;
	background-image: none !important;
	font-family: sans-serif;
	font-size: 14px !important;
	line-height: 22px !important;
	text-align: center;
	text-indent: 0 !important;
	color: #555555;
	opacity: .7;
}
/* The origin names are long enough that the dropdown must not shrink to the
   width of "Alle". Scoped to this one group - jQuery Mobile wraps every select
   in .ui-select, so an unscoped rule would widen anything that comes later. */
#sourcefilter .ui-select,
#sourcefilter .ui-select .ui-btn { min-width:200px; }

/* Everything in the filter row is as tall as the status buttons.

   Those get their height from .s4l-filtergroup above - 21px of line box instead
   of the theme's 16.25 - and the source dropdown and the two buttons beside it
   did not, so they came out five pixels shorter and sat five pixels lower. The
   Loxone page has the same rule for its own dropdowns. */
#sourcefilter .ui-select .ui-btn,
#btncountall,
.s4l-resetbtn.ui-btn { line-height:21px; min-height:21px; }

.s4l-btn-danger.ui-btn, html body .s4l-btn-danger.ui-btn,
html body .s4l-btn-danger.ui-btn:visited {
	background:#c0392b; border-color:#a93226; color:#ffffff; text-shadow:none;
}
html body .s4l-btn-danger.ui-btn:hover,
html body .s4l-btn-danger.ui-btn:focus {
	background:#a93226; border-color:#922b21; color:#ffffff; text-shadow:none;
}

.hintbox { background-color:#ffff73; padding:10px; border:1px solid gray; margin:10px 0; }
</style>

<!-- Filter -->
<div style="display:flex;align-items:flex-end;flex-wrap:wrap;">

	<div style="padding:5px;">
	<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true" class="s4l-filtergroup">
		<legend><TMPL_VAR INFLUXPAGE.LABEL_FILTER_STATUS></legend>
		<input type="radio" name="filter_status" id="filter_status_all" value="all" checked="checked" class="filter_radio">
		<label for="filter_status_all"><span class="filter_icon"><TMPL_VAR INFLUXPAGE.LABEL_ALL></span></label>
		<input type="radio" name="filter_status" id="filter_status_ok" value="ok" class="filter_radio">
		<label for="filter_status_ok" title="<TMPL_VAR INFLUXPAGE.STATUS_OK>"><span class="filter_icon"><span class="s4l-icon s4l-icon-ok"></span></span></label>
		<input type="radio" name="filter_status" id="filter_status_warn" value="warn" class="filter_radio">
		<label for="filter_status_warn" title="<TMPL_VAR INFLUXPAGE.STATUS_LIMIT>"><span class="filter_icon"><span class="s4l-icon s4l-icon-warn"></span></span></label>
		<input type="radio" name="filter_status" id="filter_status_err" value="err" class="filter_radio">
		<label for="filter_status_err" title="<TMPL_VAR INFLUXPAGE.STATUS_404>"><span class="filter_icon"><span class="s4l-icon s4l-icon-err"></span></span></label>
		<input type="radio" name="filter_status" id="filter_status_grey" value="grey" class="filter_radio">
		<label for="filter_status_grey" title="<TMPL_VAR INFLUXPAGE.STATUS_OFF>"><span class="filter_icon"><span class="s4l-icon s4l-icon-label">Off</span></span></label>
	</fieldset>
	</div>

	<div style="padding:5px;" id="sourcefilter">
	<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
		<legend><TMPL_VAR INFLUXPAGE.LABEL_FILTER_SOURCE></legend>
		<select name="filter_source" id="filter_source" class="filter_select" data-mini="true">
			<option value="all"><TMPL_VAR INFLUXPAGE.LABEL_ALL></option>
		</select>
	</fieldset>
	</div>

	<!-- The same step away from the filter groups the reset button keeps, so the
	     two buttons that are not filters read as a pair. -->
	<div style="padding:5px;margin-left:10px;">
	<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
		<a href="javascript:countAll();" id="btncountall" class="ui-btn ui-btn-inline ui-mini ui-corner-all"
		   title="<TMPL_VAR INFLUXPAGE.HOVER_COUNT_ALL>"><TMPL_VAR INFLUXPAGE.BUTTON_COUNT_ALL></a>
	</fieldset>
	</div>

	<!-- Everything back to "all". Icon only, wording in the tooltip: "Alle Filter
	     zurücksetzen" is far too long for a button in this row, and the circular
	     arrow is the same one the status reset in the table already uses.

	     The search field is deliberately left untouched - it is the one filter a
	     user types on purpose, and it sits in its own row below anyway.

	     In the same controlgroup its neighbours use, but without their legend:
	     the controlgroup carries a bottom margin of its own, and in a bare div
	     the button sat seven pixels below every dropdown. A legend would push it
	     back down again - it is the caption of a filter group, and this is not
	     one. -->
	<div class="s4l-resetfilterwrap">
	<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true">
		<a href="#" id="btnResetFilters" class="ui-btn ui-mini ui-corner-all s4l-resetbtn"
		   title="<TMPL_VAR COMMON.BUTTON_RESET_FILTERS>"
		   aria-label="<TMPL_VAR COMMON.BUTTON_RESET_FILTERS>"></a>
	</fieldset>
	</div>

</div>

<!-- Search line, like on the Loxone page: its own row, full width, no label -->
<div>
	<input type="search" name="filter_search" id="filter_search" value="" data-mini="true" data-clear-btn="true">
</div>

<div id="influx_summary" class="small grayed s4l-summary">&nbsp;</div>
<div id="influxtablediv"><p><TMPL_VAR COMMON.HINT_PLEASE_WAIT></p></div>

<!-- Deleting a measurement has to be confirmed - the values are gone for good -->
<div data-role="popup" id="popupDrop" data-dismissible="false" data-theme="a" data-overlay-theme="a" class="ui-content" style="max-width:520px">
	<a href="#" data-rel="back" class="ui-btn ui-corner-all ui-shadow ui-btn-a ui-icon-delete ui-btn-icon-notext ui-btn-right"><TMPL_VAR COMMON.BUTTON_CLOSE></a>
	<center><h3 class="popuptitle"><TMPL_VAR INFLUXPAGE.POPUP_DROP_TITLE></h3></center>
	<p id="drop_what">&nbsp;</p>
	<!-- A warning, not an error: the statistic is switched off along the way,
	     so nothing is left for the user to do. Hence the yellow box. -->
	<div id="drop_activewarn" class="hintbox small" style="display:none;">
		<TMPL_VAR INFLUXPAGE.CONFIRM_DROP_ACTIVE>
	</div>
	<div style="text-align:center;padding-top:10px;">
		<a href="#" id="drop_only" class="ui-btn ui-btn-inline ui-mini ui-corner-all s4l-btn-danger"><TMPL_VAR INFLUXPAGE.BUTTON_DROP></a>
		<a href="#" id="drop_and_off" class="ui-btn ui-btn-inline ui-mini ui-corner-all s4l-btn-danger" style="display:none;"><TMPL_VAR INFLUXPAGE.BUTTON_DROP_AND_DEACTIVATE></a>
	</div>
	<div id="drop_hint" style="text-align:center;padding-top:8px;">&nbsp;</div>
</div>
