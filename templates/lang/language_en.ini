[MINISERVER]
TITLE="Miniserver vital signs"
LABEL_ACTIVE="Collect data:"
HINT_ACTIVE="Stats4Lox regularly asks every configured Miniserver about its own condition: processor load, free memory, counters of the Loxone bus and of the network interface, number of tasks and the state of the alarm system. None of that belongs to a Loxone block, so it is switched on and off here rather than on the Loxone tab. Switching it off keeps everything collected so far - it only stops new values from arriving."
LABEL_INTERVAL="Polling interval:"
HINT_INTERVAL="How often each Miniserver is asked. One round costs 19 small requests to the Miniserver, so about 5,500 a day at five minutes. Shorter intervals also catch brief peaks in load, longer ones are easier on the Miniserver and on the database. A change takes effect on the next round, at the latest after a minute."
