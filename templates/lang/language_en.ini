[MQTTLIVE]
TITLE="MQTT LiveUpdate Data"
DESCRIPTION="This listing shows, what data you have already submitted via MQTT LiveUpdate to your Loxone Statistics, and also, if your publishes might miss the correct topic."
DESCRIPTION2="Below, you'll find all available outputs of Loxone blocks that you have enabled, to directly copy/paste. An output gets enabled by enabling it in the Detail View of the Statistics configuration. See the LoxWiki step-by-step guide for assistance."
HINT_TITLE="What is MQTT LiveUpdate good for?"
HINT_TEXT="The normal Statistics Grabber collects data in your defined interval (5 mins, 10 mins etc.). Data, that rapidly update, like power metering, or presses of a button, cannot be collected in that way. With MQTT LiveUpdate (MQTT Gateway plugin required), you create a virtual output command to MQTT Gateway and connect this to the block output with rapid updates (e.g. Current power). Every change of this output directly sends the data to your Stats4Lox statistic. For S4L, to match your published data to Stats4Lox statistic, the publish syntax listed below is required."
