[HOME]
DESCRIPTION="Stats4Lox collects statistics from your Loxone Miniservers and system metrics, stores them in an InfluxDB time-series database and visualizes them via Grafana dashboards."
DESC_TELEGRAF="Telegraf is the metrics collection agent. It periodically queries data from your Miniservers and the LoxBerry system and forwards it to InfluxDB."
DESC_INFLUX="InfluxDB is the time-series database where all collected statistics data is stored."
DESC_GRAFANA="Grafana visualizes your statistics data as dashboards and charts. Open the Grafana interface to explore your data."
DESC_MQTT="The MQTT service receives real-time updates from Loxone blocks (MQTT Live) and collects data from any MQTT devices (MQTT Collector)."

