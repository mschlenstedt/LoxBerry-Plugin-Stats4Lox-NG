[MQTTCOLLECTOR]
TITLE="MQTT Collector"
DESCRIPTION="Subscribe to MQTT topics that Stats4Lox should directly push to the Influx database."
HINT_TITLE="What is MQTT Collector?"
HINT_TEXT_INTRO="With Stats4Lox's MQTT Collector, you can directly send data from MQTT devices to your InfluxDB database, bypassing the way to the Miniserver and back."
HINT_TEXT_PREREQ="<b>Prerequisite:</b> The LoxBerry MQTT Gateway Plugin must be installed and configured. Subscriptions in MQTT Gateway (that are forwarded to the Miniserver) are independent of subscriptions here."
HINT_TEXT_HOWTO="<b>How it works:</b><ol><li>Enter the desired MQTT topic (e.g. <code>tasmota/sensor/+/SENSOR</code>)</li><li>Wildcards <code>+</code> (single level) and <code>#</code> (all sub-levels) are supported</li><li>Click 'Save and Apply' — the MQTT Collector service will automatically restart</li></ol>"
HINT_TEXT_JSON="<b>JSON Payloads:</b> The Collector automatically detects JSON data and stores each value as a separate field in InfluxDB. From <code>{\"temperature\": 22.5, \"humidity\": 65}</code> two separate measurements are created."
HINT_TEXT_OPTIONS="<b>Options per topic:</b><ul><li><b>Extract Numbers</b> — Detects numeric values in text strings (e.g. extracts <code>22.5</code> from <code>\"22.5°C\"</code>)</li><li><b>Collect Strings</b> — Also stores text values in InfluxDB (by default only numeric values are collected)</li></ul>"
HINT_TEXT_DIFFERENCE="<b>Difference to MQTT LiveUpdate:</b> The MQTT Collector collects any MQTT data independently of Loxone. MQTT LiveUpdate captures Loxone block outputs in real-time and maps them to an existing Stats4Lox statistic."
PLACEHOLDER_NEW="Add new subscription"
