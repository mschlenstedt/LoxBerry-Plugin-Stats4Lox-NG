DESC_GRAFANA="Grafana visualiseert uw statistiekgegevens als dashboards en grafieken. Open de Grafana-interface om uw gegevens te verkennen."
DESC_MQTT="De MQTT-service ontvangt realtime updates van Loxone-blokken (MQTT Live) en verzamelt gegevens van alle MQTT-apparaten (MQTT Collector)."

