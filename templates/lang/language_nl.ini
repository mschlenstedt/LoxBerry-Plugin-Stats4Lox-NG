[MQTTLIVE]
TITLE="MQTT LiveUpdate-gegevens"
DESCRIPTION="Dit overzicht toont welke gegevens u al via MQTT LiveUpdate naar uw Loxone Statistieken heeft verstuurd, en ook of uw publicaties mogelijk het juiste onderwerp missen."
DESCRIPTION2="Hieronder vindt u alle beschikbare uitgangen van Loxone-blokken die u heeft ingeschakeld, om direct te kopiëren/plakken. Een uitgang wordt ingeschakeld via de detailweergave van de statistiekconfiguratie. Raadpleeg de stap-voor-stap handleiding op LoxWiki voor hulp."
HINT_TITLE="Waarvoor is MQTT LiveUpdate nuttig?"
HINT_TEXT="De normale Statistieken Grabber verzamelt gegevens in uw gedefinieerde interval (5 min, 10 min enz.). Gegevens die snel worden bijgewerkt, zoals energiemeting of het indrukken van een knop, kunnen op die manier niet worden verzameld. Met MQTT LiveUpdate (MQTT Gateway-plugin vereist) maakt u een virtuele uitgangscommando naar MQTT Gateway en verbindt u dit met de blokuitgang met snelle updates (bijv. huidig vermogen). Elke wijziging van deze uitgang stuurt de gegevens direct naar uw Stats4Lox statistiek. Voor S4L, om uw gepubliceerde gegevens te koppelen aan de Stats4Lox statistiek, is de hieronder vermelde publicatiesyntax vereist."
SECTION_STATE="MQTT Live status"
SECTION_RECEIVED="Ontvangen updates"
SECTION_AVAILABLE="MQTT Live — alle beschikbare updateonderwerpen"
