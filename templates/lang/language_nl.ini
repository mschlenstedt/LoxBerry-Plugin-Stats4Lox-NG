[MQTTCOLLECTOR]
TITLE="MQTT Collector"
DESCRIPTION="Abonneer op MQTT-onderwerpen die Stats4Lox direct naar de Influx-database moet doorsturen."
HINT_TITLE="Wat is MQTT Collector?"
HINT_TEXT_INTRO="Met de MQTT Collector van Stats4Lox kunt u gegevens van MQTT-apparaten rechtstreeks naar uw InfluxDB-database sturen, zonder de omweg via de Miniserver."
HINT_TEXT_PREREQ="<b>Vereiste:</b> De LoxBerry MQTT Gateway Plugin moet geïnstalleerd en geconfigureerd zijn. Abonnementen in MQTT Gateway (die worden doorgestuurd naar de Miniserver) staan los van abonnementen hier."
HINT_TEXT_HOWTO="<b>Werking:</b><ol><li>Voer het gewenste MQTT-onderwerp in (bijv. <code>tasmota/sensor/+/SENSOR</code>)</li><li>Jokertekens <code>+</code> (één niveau) en <code>#</code> (alle subniveaus) worden ondersteund</li><li>Klik op 'Opslaan en toepassen' — de MQTT Collector-service wordt automatisch opnieuw gestart</li></ol>"
HINT_TEXT_JSON="<b>JSON-payloads:</b> De Collector detecteert JSON-gegevens automatisch en slaat elke waarde op als een afzonderlijk veld in InfluxDB. Van <code>{\"temperature\": 22.5, \"humidity\": 65}</code> worden twee afzonderlijke metingen aangemaakt."
HINT_TEXT_OPTIONS="<b>Opties per onderwerp:</b><ul><li><b>Getallen extraheren</b> — Detecteert numerieke waarden in tekstreeksen (bijv. extraheert <code>22.5</code> uit <code>\"22.5°C\"</code>)</li><li><b>Teksten opslaan</b> — Slaat ook tekstwaarden op in InfluxDB (standaard worden alleen numerieke waarden verzameld)</li></ul>"
HINT_TEXT_DIFFERENCE="<b>Verschil met MQTT LiveUpdate:</b> De MQTT Collector verzamelt willekeurige MQTT-gegevens onafhankelijk van Loxone. MQTT LiveUpdate legt Loxone-blokuitgangen realtime vast en koppelt deze aan een bestaande Stats4Lox statistiek."
