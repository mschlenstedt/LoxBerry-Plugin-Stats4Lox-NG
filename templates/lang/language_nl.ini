ADVICE_CONFIRM="De uitvoering zou gegevens definitief wissen en wacht op je uitdrukkelijke bevestiging. Klik op “Opslaan en toepassen” en lees het venster – daar staat wat zou verdwijnen, en daar bevestig je het."
ADVICE_START="De uitvoering kon niet worden gestart. Loopt er misschien al een? Herlaad de pagina en probeer het opnieuw."
ADVICE_DATABASE="De database antwoordde niet. Controleer op de pagina Home of InfluxDB draait en probeer het dan opnieuw. Je gegevens zijn ongewijzigd."
ADVICE_GENERIC="De uitvoering is gestopt en heeft niets gewist. Wat er precies gebeurde staat in het logbestand. Probeer het opnieuw; blijft de fout, meld hem dan met het logbestand op GitHub."
WARN_MIXEDRES="Trap __N__ bevat al waarden die met het vorige interval zijn verdicht. Die behouden hun resolutie; alleen nieuwe waarden komen er met __IV__ bij. De gegevens kloppen – er staan in het verleden alleen meer punten dan de naam van de trap belooft."
HINT_STILL_RUNNING="De uitvoering loopt op de achtergrond door."
BUTTON_SHOW_PROGRESS="Voortgang tonen"
BUTTON_RUN_BACKGROUND="Op de achtergrond laten lopen"
[MINISERVER]
TITLE="Kerngegevens van de Miniservers"
DESCRIPTION="Elke Miniserver weet heel wat over zichzelf: hoe druk zijn processor het heeft, hoe warm hij wordt, hoeveel pakketten er over de Loxone-bus en over het netwerk gaan. Niets daarvan hoort bij een Loxone-blok, en daarom staat het hier en niet bij de statistiekkeuze. Stats4Lox haalt het op via de webservices van de Miniserver en schrijft het naar de meetreeks stats_miniserver."
LABEL_ACTIVE="Verzamelen inschakelen:"
HINT_ACTIVE="Geldt voor alle ingestelde Miniservers. Bij uitschakelen blijven de tot nu toe verzamelde waarden bewaard; er komen alleen geen nieuwe meer bij."
LABEL_INTERVAL="Opvraaginterval:"
HINT_INTERVAL="Hoe vaak elke Miniserver wordt gevraagd. Elke gekozen waarde is één klein verzoek aan de Miniserver. Kortere intervallen laten ook korte belastingpieken zien, langere ontzien de Miniserver en de database. De wijziging werkt vanaf de volgende ronde, uiterlijk na een minuut."
INTERVAL_MINUTE="Elke minuut"
INTERVAL_SECONDS="Elke __N__ seconden"
INTERVAL_MINUTES="Elke __N__ minuten"
INTERVAL_HOUR="Elk uur"
LABEL_METRICS="Welke waarden:"
HINT_METRICS="Kies wat er moet worden vastgelegd. Elke waarde wordt een eigen veld in de database, volgens het patroon msno_1_sys_cpu. Haal je een waarde er later weer uit, dan blijven het veld en zijn geschiedenis bestaan — het groeit alleen niet verder."
HINT_UNDOCUMENTED="De tellers van de Loxone-bus en van het netwerk zijn door Loxone niet gedocumenteerd. Ze antwoorden en ze tellen; de labels zeggen waar de afkortingen naar alle waarschijnlijkheid voor staan. Niet elke Miniserver kent elke waarde — wat die van jou werkelijk leveren, laat de knop hieronder zien."
