[MQTTLIVE]
TITLE="MQTT LiveUpdate Data"
DESCRIPTION="Tento přehled ukazuje, jaká data jste již odeslali přes MQTT LiveUpdate do vašich Loxone statistik, a zda vaše publikace používají správné topic."
DESCRIPTION2="Níže najdete všechny dostupné výstupy bloků Loxone, které jste aktivovali, ke zkopírování. Výstup se aktivuje zapnutím v podrobném zobrazení konfigurace statistik. Podrobnosti najdete v průvodci LoxWiki."
HINT_TITLE="K čemu slouží MQTT LiveUpdate?"
HINT_TEXT="Normální grabber statistik sbírá data ve vámi definovaném intervalu (5 min, 10 min atd.). Data, která se rychle mění, jako měření výkonu nebo stisk tlačítka, takto sbírat nelze. S MQTT LiveUpdate (vyžaduje plugin MQTT Gateway) vytvoříte virtuální výstupní příkaz do MQTT Gateway a propojíte jej s výstupem bloku s rychlými změnami (např. aktuální výkon). Každá změna tohoto výstupu odešle data přímo do vaší Stats4Lox statistiky. Aby S4L přiřadil vaše publikovaná data ke Stats4Lox statistice, je vyžadována níže uvedená syntaxe publikování."
