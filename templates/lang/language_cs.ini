[MINISERVER]
TITLE="Provozní údaje Miniserverů"
DESCRIPTION="Každý Miniserver toho o sobě ví docela dost: jak je vytížený jeho procesor, jak se zahřívá, kolik paketů projde sběrnicí Loxone a sítí. Nic z toho nepatří k žádnému bloku Loxone, a proto je to zde a ne ve výběru statistik. Stats4Lox to získává přes webové služby Miniserveru a zapisuje do měření stats_miniserver."
