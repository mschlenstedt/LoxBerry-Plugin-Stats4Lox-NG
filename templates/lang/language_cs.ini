[HOME]
DESCRIPTION="Stats4Lox sbírá statistiky z vašich Loxone Miniserverů a systémové metriky, ukládá je do časové databáze InfluxDB a vizualizuje je pomocí dashboardů Grafana."
DESC_TELEGRAF="Telegraf je agent pro sběr metrik. Pravidelně dotazuje data z vašich Miniserverů a systému LoxBerry a předává je do InfluxDB."
