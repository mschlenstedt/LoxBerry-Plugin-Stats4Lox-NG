[MQTTCOLLECTOR]
TITLE="MQTT Collector"
DESCRIPTION="Přihlaste se k odběru MQTT topics, jejichž data má Stats4Lox zapisovat přímo do databáze Influx."
HINT_TITLE="Co je MQTT Collector?"
HINT_TEXT_INTRO="S MQTT Collectorem Stats4Lox můžete odesílat data z MQTT zařízení přímo do vaší databáze InfluxDB, bez okličky přes Miniserver."
HINT_TEXT_PREREQ="<b>Předpoklad:</b> Plugin LoxBerry MQTT Gateway musí být nainstalován a nakonfigurován. Odběry v MQTT Gateway (přeposílané na Miniserver) jsou nezávislé na odběrech zde."
HINT_TEXT_HOWTO="<b>Jak to funguje:</b><ol><li>Zadejte požadované MQTT topic (např. <code>tasmota/sensor/+/SENSOR</code>)</li><li>Zástupné znaky <code>+</code> (jedna úroveň) a <code>#</code> (všechny podúrovně) jsou podporovány</li><li>Klikněte na 'Uložit a použít' — služba MQTT Collector se automaticky restartuje</li></ol>"
HINT_TEXT_JSON="<b>JSON Payloads:</b> Collector automaticky detekuje JSON data a ukládá každou hodnotu jako samostatné pole v InfluxDB. Z <code>{\"temperature\": 22.5, \"humidity\": 65}</code> se vytvoří dvě samostatná měření."
HINT_TEXT_OPTIONS="<b>Možnosti pro každé topic:</b><ul><li><b>Extrahovat čísla</b> — Rozpozná číselné hodnoty v textových řetězcích (např. z <code>\"22.5°C\"</code> extrahuje <code>22.5</code>)</li><li><b>Sbírat řetězce</b> — Ukládá do InfluxDB i textové hodnoty (standardně se sbírají pouze číselné hodnoty)</li></ul>"
HINT_TEXT_DIFFERENCE="<b>Rozdíl oproti MQTT LiveUpdate:</b> MQTT Collector sbírá libovolná MQTT data nezávisle na Loxone. MQTT LiveUpdate zachycuje výstupy bloků Loxone v reálném čase a přiřazuje je k existující Stats4Lox statistice."
