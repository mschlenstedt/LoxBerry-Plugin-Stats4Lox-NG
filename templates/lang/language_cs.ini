DESC_GRAFANA="Grafana vizualizuje vaše statistická data jako dashboardy a grafy. Otevřete rozhraní Grafana a prozkoumejte svá data."
DESC_MQTT="Služba MQTT přijímá aktualizace v reálném čase z bloků Loxone (MQTT Live) a sbírá data z libovolných MQTT zařízení (MQTT Collector)."

