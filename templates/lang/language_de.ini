LABEL_INTERVAL="Abfrageintervall:"
HINT_INTERVAL="Wie oft jeder Miniserver gefragt wird. Jeder ausgewählte Wert ist eine eigene kleine Anfrage an den Miniserver. Kürzere Intervalle zeigen auch kurze Lastspitzen, längere schonen Miniserver und Datenbank. Die Änderung greift beim nächsten Durchlauf, spätestens nach einer Minute."
