[MQTTLIVE]
TITLE="MQTT LiveUpdate-Daten"
DESCRIPTION="Diese Übersicht zeigt, welche Daten Sie bereits per MQTT LiveUpdate an Ihre Loxone-Statistiken gesendet haben, und ob Ihre Publishes das richtige Topic verwenden."
DESCRIPTION2="Unten finden Sie alle verfügbaren Ausgänge der Loxone-Bausteine, die Sie aktiviert haben, zum direkten Kopieren. Ein Ausgang wird aktiviert, indem Sie ihn in der Detailansicht der Statistik-Konfiguration einschalten. Weitere Informationen finden Sie in der LoxWiki-Anleitung."
HINT_TITLE="Wozu dient MQTT LiveUpdate?"
HINT_TEXT="Der normale Statistik-Grabber sammelt Daten in Ihrem definierten Intervall (z.B. alle 5 oder 10 Minuten). Daten, die sich schnell ändern (z.B. aktuelle Leistung eines Wechselrichters oder Tastendruck), können so nicht erfasst werden. Mit MQTT LiveUpdate (MQTT Gateway Plugin erforderlich) erstellen Sie einen virtuellen Ausgangsbefehl zum MQTT Gateway und verbinden diesen mit dem Baustein-Ausgang, der sich schnell ändert. Jede Änderung dieses Ausgangs sendet die Daten direkt an Ihre Stats4Lox-Statistik. Damit Stats4Lox die veröffentlichten Daten der richtigen Statistik zuordnen kann, ist die unten aufgelistete Publish-Syntax erforderlich."
