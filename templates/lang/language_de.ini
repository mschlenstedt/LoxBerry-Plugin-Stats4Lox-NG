[MQTTCOLLECTOR]
TITLE="MQTT Collector"
HINT_TITLE="Was ist der MQTT Collector?"
HINT_TEXT_INTRO="Mit dem MQTT Collector können Sie Daten von beliebigen MQTT-Geräten direkt in Ihre InfluxDB-Datenbank schreiben — ohne den Umweg über den Loxone Miniserver."
HINT_TEXT_PREREQ="<b>Voraussetzung:</b> Das LoxBerry MQTT Gateway muss konfiguriert sein. Die Subscriptions im MQTT Gateway (die an den Miniserver weitergeleitet werden) sind unabhängig von den Subscriptions hier."
HINT_TEXT_HOWTO="<b>So funktioniert's:</b><ol><li>Tragen Sie das gewünschte MQTT-Topic ein (z.B. <code>tasmota/sensor/+/SENSOR</code>)</li><li>Wildcards <code>+</code> (eine Ebene) und <code>#</code> (alle Unterebenen) werden unterstützt</li><li>Klicken Sie 'Speichern und Anwenden' — der MQTT Collector Dienst wird automatisch neu gestartet</li></ol>"
HINT_TEXT_JSON="<b>JSON-Payloads:</b> Der Collector erkennt automatisch JSON-Daten und speichert jeden Wert als eigenes Feld in InfluxDB. Aus <code>{\"temperature\": 22.5, \"humidity\": 65}</code> werden zwei separate Messwerte. Standardmäßig werden alle Werte innerhalb des JSONs importiert. Mit <b>JSON Expand</b> können Sie auch einzelne Werte auswählen."
HINT_TEXT_OPTIONS="<b>Optionen pro Topic:</b><ul><li><b>Zahlen extrahieren</b> — Erkennt Zahlenwerte in Textstrings (z.B. wird aus <code>\"22.5°C\"</code> der Wert <code>22.5</code> extrahiert)</li><li><b>Strings erfassen</b> — Speichert auch Textwerte in InfluxDB (standardmäßig werden nur numerische Werte erfasst)</li><li><b>JSON Expand</b> — Einzelne Werte aus dem JSON importieren (standardmäßig werden alle Werte importiert)</li></ul>"
HINT_TEXT_DIFFERENCE="<b>Unterschied zu MQTT Live:</b> Der MQTT Collector sammelt beliebige MQTT-Daten unabhängig von Loxone. MQTT Live hingegen erfasst Loxone-Baustein-Ausgänge in Echtzeit und ordnet sie einer bestehenden Stats4Lox-Statistik zu."
