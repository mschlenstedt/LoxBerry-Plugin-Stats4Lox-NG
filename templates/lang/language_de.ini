ADVICE_CONFIRM="Der Vorgang würde Daten endgültig löschen und wartet auf Deine ausdrückliche Bestätigung. Drücke „Speichern und Anwenden“ und lies das Fenster – dort steht, was verschwinden würde, und dort bestätigst Du es."
