[MINISERVER]
TITLE="Kennzahlen der Miniserver"
DESCRIPTION="Jeder Miniserver weiß einiges über sich selbst: wie ausgelastet sein Prozessor ist, wie warm er wird, wie viele Pakete über den Loxone-Bus und über das Netzwerk gehen. Diese Werte gehören zu keinem Loxone-Baustein — Du findest sie deshalb hier und nicht in der Statistik-Auswahl. Stats4Lox holt sie über die Webservices des Miniservers und schreibt sie in die Messreihe stats_miniserver."
