[HOME]
DESCRIPTION="Stats4Lox sammelt Statistikdaten von Ihren Loxone Miniservern und Systemmetriken, speichert sie in einer InfluxDB-Zeitreihendatenbank und stellt sie über Grafana-Dashboards dar."
DESC_TELEGRAF="Telegraf ist der Metrik-Sammel-Agent. Er fragt in regelmäßigen Abständen Daten von Ihren Miniservern und dem LoxBerry-System ab und leitet sie an InfluxDB weiter."
DESC_INFLUX="InfluxDB ist die Zeitreihendatenbank, in der alle gesammelten Statistikdaten gespeichert werden."
DESC_GRAFANA="Grafana stellt Ihre Statistikdaten als Dashboards und Diagramme dar. Öffnen Sie die Grafana-Oberfläche, um Ihre Daten zu visualisieren."
DESC_MQTT="Der MQTT-Dienst empfängt Echtzeit-Updates von Loxone-Bausteinen (MQTT Live) und sammelt Daten von beliebigen MQTT-Geräten (MQTT Collector)."

