[HOME]
DESCRIPTION="Stats4Lox recopila estadísticas de sus Miniservers Loxone y métricas del sistema, las almacena en una base de datos de series temporales InfluxDB y las visualiza mediante paneles de Grafana."
DESC_TELEGRAF="Telegraf es el agente de recopilación de métricas. Consulta periódicamente datos de sus Miniservers y del sistema LoxBerry, y los reenvía a InfluxDB."
DESC_INFLUX="InfluxDB es la base de datos de series temporales donde se almacenan todos los datos estadísticos recopilados."
DESC_GRAFANA="Grafana visualiza sus datos estadísticos en paneles y gráficos. Abra la interfaz de Grafana para explorar sus datos."
DESC_MQTT="El servicio MQTT recibe actualizaciones en tiempo real de bloques Loxone (MQTT Live) y recopila datos de cualquier dispositivo MQTT (MQTT Collector)."

