[MQTTCOLLECTOR]
TITLE="MQTT Collector"
DESCRIPTION="Suscríbase a topics MQTT que Stats4Lox debe enviar directamente a la base de datos Influx."
HINT_TITLE="¿Qué es el MQTT Collector?"
HINT_TEXT_INTRO="Con el MQTT Collector de Stats4Lox, puede enviar datos directamente desde dispositivos MQTT a su base de datos InfluxDB, sin pasar por el Miniserver."
HINT_TEXT_PREREQ="<b>Requisito previo:</b> El plugin LoxBerry MQTT Gateway debe estar instalado y configurado. Las suscripciones en MQTT Gateway (que se reenvían al Miniserver) son independientes de las suscripciones aquí."
HINT_TEXT_HOWTO="<b>Cómo funciona:</b><ol><li>Introduzca el topic MQTT deseado (p. ej. <code>tasmota/sensor/+/SENSOR</code>)</li><li>Se admiten los comodines <code>+</code> (un nivel) y <code>#</code> (todos los subniveles)</li><li>Haga clic en 'Guardar y aplicar' — el servicio MQTT Collector se reiniciará automáticamente</li></ol>"
HINT_TEXT_JSON="<b>Payloads JSON:</b> El Collector detecta automáticamente datos JSON y almacena cada valor como un campo separado en InfluxDB. De <code>{\"temperature\": 22.5, \"humidity\": 65}</code> se crean dos mediciones independientes."
HINT_TEXT_OPTIONS="<b>Opciones por topic:</b><ul><li><b>Extraer números</b> — Detecta valores numéricos en cadenas de texto (p. ej., extrae <code>22.5</code> de <code>\"22.5°C\"</code>)</li><li><b>Recopilar cadenas</b> — También almacena valores de texto en InfluxDB (por defecto solo se recopilan valores numéricos)</li></ul>"
HINT_TEXT_DIFFERENCE="<b>Diferencia con MQTT LiveUpdate:</b> El MQTT Collector recopila cualquier dato MQTT independientemente de Loxone. MQTT LiveUpdate captura las salidas de bloques Loxone en tiempo real y las asocia a una estadística Stats4Lox existente."
