ADVICE_BACKFILL="Hay valores que se borrarían y que no están en ningún nivel posterior. Pulsa “Guardar y aplicar” y elige “Condensar el histórico y aplicar” en la ventana: así se recalcula el histórico primero."
ADVICE_CONFIRM="La ejecución borraría datos definitivamente y espera tu confirmación expresa. Pulsa “Guardar y aplicar” y lee la ventana: ahí se indica qué desaparecería y ahí lo confirmas."
