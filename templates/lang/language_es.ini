[MQTTLIVE]
TITLE="Datos de MQTT Live"
DESCRIPTION="Esta vista muestra qué datos ha enviado ya a sus estadísticas de Loxone mediante MQTT Live y si sus publicaciones usan el topic correcto."
DESCRIPTION2="Abajo encontrará todas las salidas disponibles de los bloques Loxone que ha activado — listas para copiar. Una salida se activa encendiéndola en la pestaña «Loxone & Import»."
HINT_TITLE="¿Para qué sirve MQTT Live?"
HINT_TEXT="El grabber de estadísticas normal recopila datos en el intervalo que usted define (por ejemplo, cada 5 o 10 minutos). Los datos que cambian con rapidez (la potencia actual de un inversor o la pulsación de un botón) no pueden registrarse así. Con MQTT Live crea un comando de salida virtual hacia el MQTT Gateway y lo conecta con la salida del bloque. Cada cambio de esa salida envía los datos directamente a su estadística de Stats4Lox. Para que Stats4Lox asigne los datos publicados a la estadística correcta, se requiere la sintaxis de publicación indicada abajo."
HINT_TEXT_DIFFERENCE="<b>Diferencia con el MQTT Collector:</b> El MQTT Collector recopila cualquier dato MQTT independientemente de Loxone. MQTT Live captura las salidas de bloques Loxone en tiempo real y las asocia a una estadística Stats4Lox existente."
