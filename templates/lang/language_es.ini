[MINISERVER]
TITLE="Datos de estado de los Miniserver"
DESCRIPTION="Cada Miniserver sabe bastante sobre sí mismo: cuánto trabaja su procesador, cuánto se calienta, cuántos paquetes pasan por el bus Loxone y por la red. Nada de eso pertenece a un bloque de Loxone, por eso está aquí y no en la selección de estadísticas. Stats4Lox lo obtiene mediante los servicios web del Miniserver y lo escribe en la serie stats_miniserver."
LABEL_ACTIVE="Activar la recogida:"
HINT_ACTIVE="Vale para todos los Miniserver configurados. Al desactivarlo se conservan los valores recogidos hasta ahora; solo dejan de llegar nuevos."
LABEL_INTERVAL="Intervalo de consulta:"
HINT_INTERVAL="Con qué frecuencia se pregunta a cada Miniserver. Cada valor seleccionado es una pequeña petición al Miniserver. Los intervalos cortos muestran también los picos breves de carga; los largos son más suaves para el Miniserver y la base de datos. El cambio surte efecto en la siguiente ronda, como muy tarde al cabo de un minuto."
