WARN_GRAFANA="Tus paneles actuales de Grafana mostrarán después solo los últimos __DUR__. Los valores condensados están ahí, pero se encuentran en un nivel de conservación propio y se llaman mean_<campo> y last_<campo>: un panel los encuentra solo cuando se le apunta a ellos."
RUN_INTERRUPTED="La última ejecución se interrumpió"
ADVICE_INTERRUPTED="La ejecución seguía en marcha cuando el LoxBerry se reinició o falló. No se borró nada: solo se borra cuando la condensación está completa. Puedes continuar donde se quedó o empezar de nuevo. Ambas cosas son seguras: los valores ya condensados simplemente se vuelven a escribir, no se duplican."
