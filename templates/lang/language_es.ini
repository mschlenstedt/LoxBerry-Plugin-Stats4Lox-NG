[MQTTLIVE]
TITLE="Datos de actualización en vivo MQTT"
DESCRIPTION="Este listado muestra qué datos ya ha enviado mediante MQTT LiveUpdate a sus estadísticas Loxone y si sus publicaciones podrían estar usando un topic incorrecto."
DESCRIPTION2="A continuación encontrará todas las salidas disponibles de los bloques Loxone que ha activado, listas para copiar y pegar. Una salida se activa habilitándola en la vista de detalles de la configuración de estadísticas. Consulte la guía paso a paso de LoxWiki para obtener ayuda."
HINT_TITLE="¿Para qué sirve MQTT LiveUpdate?"
HINT_TEXT="El grabador de estadísticas normal recopila datos en el intervalo definido (5 min, 10 min, etc.). Los datos que se actualizan rápidamente, como la medición de potencia o las pulsaciones de un botón, no pueden recopilarse de esa manera. Con MQTT LiveUpdate (requiere el plugin MQTT Gateway), crea un comando de salida virtual hacia MQTT Gateway y lo conecta a la salida del bloque con actualizaciones rápidas (p. ej., potencia actual). Cada cambio en esta salida envía directamente los datos a su estadística Stats4Lox. Para que S4L asocie sus datos publicados a la estadística Stats4Lox, se requiere la sintaxis de publicación indicada a continuación."
