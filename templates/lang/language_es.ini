HINT_UNDOCUMENTED="Loxone no documenta los contadores del bus Loxone ni los de red. Responden y cuentan; las etiquetas dicen lo que las abreviaturas significan con toda probabilidad. No todos los Miniserver conocen todos los valores: el botón de abajo muestra lo que entregan los tuyos."
