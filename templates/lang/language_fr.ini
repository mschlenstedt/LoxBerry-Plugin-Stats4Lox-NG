[MQTTLIVE]
TITLE="Données MQTT LiveUpdate"
DESCRIPTION="Cette liste montre les données que vous avez déjà transmises via MQTT LiveUpdate à vos statistiques Loxone, ainsi que si vos publications utilisent peut-être un mauvais topic."
DESCRIPTION2="Ci-dessous, vous trouverez toutes les sorties disponibles des blocs Loxone que vous avez activées, à copier/coller directement. Une sortie est activée en l'activant dans la vue Détails de la configuration des statistiques. Consultez le guide pas à pas LoxWiki pour obtenir de l'aide."
HINT_TITLE="À quoi sert MQTT LiveUpdate ?"
HINT_TEXT="Le grabber de statistiques normal collecte les données selon votre intervalle défini (5 min, 10 min, etc.). Les données qui se mettent à jour rapidement, comme la mesure de puissance ou les appuis sur un bouton, ne peuvent pas être collectées de cette façon. Avec MQTT LiveUpdate (plugin MQTT Gateway requis), vous créez une commande de sortie virtuelle vers MQTT Gateway et la connectez à la sortie du bloc avec des mises à jour rapides (p. ex. puissance instantanée). Chaque changement de cette sortie envoie directement les données à votre statistique Stats4Lox. Pour que S4L associe vos données publiées à la statistique Stats4Lox, la syntaxe de publication indiquée ci-dessous est requise."
SECTION_STATE="État MQTT Live"
SECTION_RECEIVED="Mises à jour reçues"
SECTION_AVAILABLE="Tous les topics de mise à jour disponibles MQTT Live"
