[MQTTCOLLECTOR]
TITLE="MQTT Collector"
DESCRIPTION="Abonnez-vous à des topics MQTT que Stats4Lox doit envoyer directement à la base de données Influx."
HINT_TITLE="Qu'est-ce que le MQTT Collector ?"
HINT_TEXT_INTRO="Avec le MQTT Collector de Stats4Lox, vous pouvez envoyer directement des données d'appareils MQTT vers votre base de données InfluxDB, en contournant le passage par le Miniserver et retour."
HINT_TEXT_PREREQ="<b>Prérequis :</b> Le plugin LoxBerry MQTT Gateway doit être installé et configuré. Les abonnements dans MQTT Gateway (transmis au Miniserver) sont indépendants des abonnements définis ici."
HINT_TEXT_HOWTO="<b>Comment ça fonctionne :</b><ol><li>Saisissez le topic MQTT souhaité (p. ex. <code>tasmota/sensor/+/SENSOR</code>)</li><li>Les jokers <code>+</code> (niveau unique) et <code>#</code> (tous les sous-niveaux) sont pris en charge</li><li>Cliquez sur 'Enregistrer et appliquer' — le service MQTT Collector redémarrera automatiquement</li></ol>"
HINT_TEXT_JSON="<b>Payloads JSON :</b> Le Collector détecte automatiquement les données JSON et stocke chaque valeur comme un champ séparé dans InfluxDB. De <code>{\"temperature\": 22.5, \"humidity\": 65}</code>, deux mesures distinctes sont créées."
HINT_TEXT_OPTIONS="<b>Options par topic :</b><ul><li><b>Extraire les nombres</b> — Détecte les valeurs numériques dans les chaînes de texte (p. ex. extrait <code>22.5</code> de <code>\"22.5°C\"</code>)</li><li><b>Collecter les chaînes</b> — Stocke également les valeurs textuelles dans InfluxDB (par défaut, seules les valeurs numériques sont collectées)</li></ul>"
HINT_TEXT_DIFFERENCE="<b>Différence avec MQTT LiveUpdate :</b> Le MQTT Collector collecte toutes les données MQTT indépendamment de Loxone. MQTT LiveUpdate capture les sorties des blocs Loxone en temps réel et les associe à une statistique Stats4Lox existante."
