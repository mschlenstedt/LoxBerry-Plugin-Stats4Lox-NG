[HOME]
DESCRIPTION="Stats4Lox collecte les statistiques de vos Miniservers Loxone et les métriques système, les stocke dans une base de données de séries temporelles InfluxDB et les visualise via des tableaux de bord Grafana."
DESC_TELEGRAF="Telegraf est l'agent de collecte de métriques. Il interroge périodiquement les données de vos Miniservers et du système LoxBerry et les transmet à InfluxDB."
DESC_INFLUX="InfluxDB est la base de données de séries temporelles dans laquelle toutes les données statistiques collectées sont stockées."
DESC_GRAFANA="Grafana visualise vos données statistiques sous forme de tableaux de bord et de graphiques. Ouvrez l'interface Grafana pour explorer vos données."
DESC_MQTT="Le service MQTT reçoit les mises à jour en temps réel des blocs Loxone (MQTT Live) et collecte les données de tout appareil MQTT (MQTT Collector)."

