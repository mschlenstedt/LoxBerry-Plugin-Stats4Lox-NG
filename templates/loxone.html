<style>
.datahidden {
	display:none;
}

.small {
	font-size:70%;
}

.grayed {
	color: gray;
}

.center {
	text-align: center;
}

.LoxoneDetails_table {
	min-width: 400px;
	width: 400px;
	border-collapse: collapse;
	border-bottom: 1px solid gray;
}

.LoxoneDetails_tr {
	padding: 2px 5px 2px 5px;
}
.LoxoneDetails_td {
	padding: 2px 5px 2px 5px;
	border-collapse: collapse;
	border-top: 1px solid gray;
	// border-bottom: 1px solid gray;
}

.controlstable {
	border-bottom: 1px solid gray;
	width:100%;
	/* Fixed layout, otherwise the browser measures the content and every
	   filter change moves the columns around. With it the widths below hold
	   whatever is in the table. */
	table-layout: fixed;
}

/* Column widths. The three narrow ones are as wide as their content needs and
   no wider - an icon, a short line, two small buttons. */
.controlstable th.col-ms      { width: 4%;  }
.controlstable th.col-name    { width: 30%; }
.controlstable th.col-loc     { width: 22%; }
.controlstable th.col-stat    { width: 10%; }
.controlstable th.col-status  { width: 6%;  }
.controlstable th.col-import  { width: 16%; }
.controlstable th.col-buttons { width: 12%; }

/* Long block names must not push the column open. Everything lines up at the
   top - the cells have different heights and a centred icon next to a
   two-line name looks misplaced. */
.controlstable td { overflow-wrap: break-word; word-break: break-word; vertical-align: top; }

/* A cell of the form "icon, then a short line underneath". The line is not
   scoped to .iconcell: the very same markup is also written into the import
   status of the details popup, and it should break there too. */
.iconcell { text-align:center; line-height:1.2em; }
.iconline { display:block; font-size:smaller; margin-top:2px; }
.statuscell { text-align:center; }

/* All four radio filter groups get the same, slightly generous height.
   The status group was taller by itself because of the 18px icon, and that
   turned out to be useful: on LoxBerry 4 the native radio input of a jQuery
   Mobile controlgroup is no longer covered and peeks out below the buttons as a
   grey circle (LoxBerry issue #1541). A taller button hides it. 21px is the
   icon plus the three pixels asked for; the other three groups follow so the
   filter row stays even. */
.s4l-filtergroup label.ui-btn
{
	line-height	:21px;
	min-height	:21px;
}
/* Every button of the status filter has the same box, whether it holds an icon
   or the word "Alle". Without it the icon labels came out a pixel taller: an
   inline-block sitting on the baseline adds the space for descenders below
   itself, which stretches the line box. A box of exactly the line height,
   aligned to the top, cannot do that - and the text button uses the same box so
   nothing can drift apart in the first place. */
.filter_icon
{
	display		:inline-block;
	height		:21px;
	line-height	:21px;
	vertical-align	:top;
}

/* The buttons sit in the middle of the row, not at the top like the text
   cells - they belong to the whole row, not to its first line. */
.controlstable td.actionbuttons { white-space:nowrap; text-align:right; vertical-align:middle; }

/* Own square buttons instead of jQuery Mobile's.
   Its icon-only buttons put the glyph on a round grey disc, which looks like a
   round button in a table of square cells. Rather than fight that with
   overrides, these two are built here - shape, colour and glyph. */
.s4l-tbtn
{
	display		:inline-block;
	width		:26px;
	height		:26px;
	border-radius	:3px;
	border		:1px solid #7e7e7e;
	background	:#e6e6e6;
	position	:relative;
	vertical-align	:middle;
	margin		:0 0 0 4px;
	box-sizing	:border-box;
	cursor		:pointer;
	/* The buttons carry no text at all - what they do is in the title and in
	   aria-label. Hiding a text with text-indent left it showing through. */
	font-size	:0;
	line-height	:0;
}
.s4l-tbtn:hover { background:#d5d5d5; }
.s4l-tbtn-danger
{
	background	:#c0392b;
	border-color	:#a93226;
}
.s4l-tbtn-danger:hover { background:#a93226; }

/* Gear: two overlapping rounded squares give the eight teeth, the hole in the
   middle is punched in the button colour. */
.s4l-tbtn-gear::before,
.s4l-tbtn-gear::after
{
	content		:"";
	position	:absolute;
	left		:5px;
	top		:5px;
	width		:14px;
	height		:14px;
	border-radius	:3px;
	background	:#3a3a3a;
}
.s4l-tbtn-gear::after { transform:rotate(45deg); }
.s4l-tbtn-gear > .hole
{
	position	:absolute;
	left		:9px;
	top		:9px;
	width		:6px;
	height		:6px;
	border-radius	:50%;
	background	:#e6e6e6;
	z-index		:1;
}
.s4l-tbtn-gear:hover > .hole { background:#d5d5d5; }

/* Cross */
.s4l-tbtn-cross::before,
.s4l-tbtn-cross::after
{
	content		:"";
	position	:absolute;
	left		:11px;
	top		:5px;
	width		:2px;
	height		:14px;
	background	:#ffffff;
}
.s4l-tbtn-cross::before { transform:rotate(45deg); }
.s4l-tbtn-cross::after  { transform:rotate(-45deg); }

/* Reset arrow */
.s4l-tbtn-reset::before
{
	content		:"";
	position	:absolute;
	left		:6px;
	top		:6px;
	width		:12px;
	height		:12px;
	border		:2px solid #3a3a3a;
	border-radius	:50%;
	border-top-color:transparent;
}
.s4l-tbtn-reset::after
{
	content		:"";
	position	:absolute;
	left		:15px;
	top		:4px;
	width		:0;
	height		:0;
	border-left	:4px solid transparent;
	border-right	:4px solid transparent;
	border-bottom	:5px solid #3a3a3a;
}

/* Sortable header */
.controlstable th.s4l-sortable { cursor:pointer; user-select:none; }
.controlstable th.s4l-sortable:hover { text-decoration:underline; }
.controlstable th .sortarrow { opacity:0.35; padding-left:3px; }
.controlstable th.sortactive .sortarrow { opacity:1; }

.controlstable tr {
	padding: 2px 5px 2px 5px;
}
.controlstable td {
	padding: 2px 5px 2px 5px;
	border-collapse: collapse;
	border-top: 1px solid gray;
	/* border-bottom: 1px solid gray; */
}

tr:nth-child(even).controlstable_tr {background: #EEE}
tr:nth-child(odd).controlstable_tr {background: #FFF}

.s4l_interval_highlight {
	background-color: #0059b3 !important;
	text-shadow:none !important;
	color:white !important;
}

.popuptitle {
	background-color: #6dac20;
	color: white;
	text-shadow: 1px 1px 2px black;
	padding: 5px;
}

#progressState {
	min-width:200px;
	min-height:70px;

}

.hintbox {
	background-color: #ffff73;
	padding: 15px;
	border: 1px solid gray;
}

.errorbox {
	border: 1px solid red;
	font-size: 85%;
}


/* The import button icon, drawn instead of the PNG the plugin shipped: an arrow
   pointing down onto a line. jQuery Mobile puts the icon in the :after of the
   button, so the arrow is built from the two borders of that one element and
   the line comes from a box-shadow. */
.ui-icon-import:after,
.ui-nosvg .ui-icon-import:after {
	background-image: none;
	background-color: rgba(0,0,0,.3);
}
.ui-btn.ui-icon-import:before {
	content: "";
	position: absolute;
	z-index: 1;
	width: 6px;
	height: 6px;
	border: solid #fff;
	border-width: 0 2px 2px 0;
	transform: rotate(45deg);
	box-shadow: 0 4px 0 -2px #fff;
}
.ui-btn-icon-left.ui-icon-import:before  { left: 0.9em;  top: 50%; margin-top: -6px; }
.ui-btn-icon-right.ui-icon-import:before { right: 1.3em; top: 50%; margin-top: -6px; }
.ui-btn-icon-top.ui-icon-import:before   { left: 50%; margin-left: -4px; top: 0.9em; }
.ui-btn-icon-notext.ui-icon-import:before { left: 50%; margin-left: -4px; top: 50%; margin-top: -6px; }

.progress-border {
	border:1px solid #ccc;
}
.progress-fill {
	background-color:#6dac20;
}

.filter-highlight {
	background-color:#ffff99 !important;
}

/* Upload of a Loxone configuration (issue #101) */
.uploadrow
{
	display		:flex;
	flex-wrap	:wrap;
	align-items	:center;
	gap		:8px;
}
.uploadrow input[type="file"] { max-width:260px; }
.uploadrow select { min-width:120px; }
/* Greyed out while the configuration is fetched automatically. Not just faded:
   pointer-events keeps the field from being usable at all, otherwise a file
   could be picked that nothing would ever read. */
#loxplanupload.disabled
{
	opacity		:0.4;
	pointer-events	:none;
}


	/* Icon set, drawn with CSS instead of the PNGs the plugin used to ship.
	   Shape carries the meaning, not just the colour - a tick, a warning
	   triangle and a cross are still distinguishable when printed, on a bad
	   screen, or by someone who cannot tell red from green. */
	.s4l-icon
	{
		display		:inline-block;
		width		:18px;
		height		:18px;
		border-radius	:3px;
		position	:relative;
		vertical-align	:middle;
		box-sizing	:border-box;
		flex-shrink	:0;
	}
	/* green, tick */
	.s4l-icon-ok { background-color:#3c9a3c; }
	.s4l-icon-ok::after
	{
		content		:"";
		position	:absolute;
		left		:6px;
		top		:3px;
		width		:5px;
		height		:9px;
		border		:solid #ffffff;
		border-width	:0 2px 2px 0;
		transform	:rotate(45deg);
	}
	/* red, cross */
	.s4l-icon-err { background-color:#c0392b; }
	.s4l-icon-err::before,
	.s4l-icon-err::after
	{
		content		:"";
		position	:absolute;
		left		:8px;
		top		:3px;
		width		:2px;
		height		:12px;
		background-color:#ffffff;
	}
	.s4l-icon-err::before { transform:rotate(45deg); }
	.s4l-icon-err::after  { transform:rotate(-45deg); }
	/* yellow, warning triangle. Built from borders, so the box itself has no
	   size - the exclamation mark is placed relative to it. */
	.s4l-icon-warn
	{
		width		:0;
		height		:0;
		border-radius	:0;
		border-left	:9px solid transparent;
		border-right	:9px solid transparent;
		border-bottom	:16px solid #e0a800;
	}
	/* The exclamation mark: stroke and dot as two separate elements. It was one
	   element with a box-shadow underneath it, and a box-shadow copies the
	   whole box - so instead of a dot there was a second stroke of the same
	   length. */
	.s4l-icon-warn::before
	{
		content		:"";
		position	:absolute;
		left		:-1px;
		top		:5px;
		width		:2px;
		height		:5px;
		background-color:#4a3b00;
	}
	.s4l-icon-warn::after
	{
		content		:"";
		position	:absolute;
		left		:-1px;
		top		:12px;
		width		:2px;
		height		:2px;
		border-radius	:50%;
		background-color:#4a3b00;
	}
	/* grey, empty - a statistic that is switched off */
	.s4l-icon-off
	{
		background-color:transparent;
		border		:2px solid #9a9a9a;
	}
	/* green, arrow pointing down into a tray - this output is imported */
	.s4l-icon-import
	{
		background-color:#6dac20;
		width		:16px;
		height		:16px;
	}
	.s4l-icon-import::before
	{
		content		:"";
		position	:absolute;
		left		:7px;
		top		:3px;
		width		:2px;
		height		:6px;
		background-color:#ffffff;
	}
	.s4l-icon-import::after
	{
		content		:"";
		position	:absolute;
		left		:5px;
		top		:6px;
		width		:6px;
		height		:6px;
		border		:solid #ffffff;
		border-width	:0 2px 2px 0;
		transform	:rotate(45deg);
	}
	/* blue, three dots - waiting in the queue */
	.s4l-icon-queued { background-color:#31708f; }
	.s4l-icon-queued::after
	{
		content		:"";
		position	:absolute;
		left		:4px;
		top		:8px;
		width		:2px;
		height		:2px;
		border-radius	:50%;
		background-color:#ffffff;
		box-shadow	:4px 0 0 0 #ffffff, 8px 0 0 0 #ffffff;
	}

	/* The status column carries the icon only - the wording is in the tooltip.
	   That keeps the column exactly as wide as one icon, whatever is filtered. */

	/* Statistics whose block is gone from the LoxPLAN. They have no row of
	   their own in Loxone Config, so the row is marked to make clear it is not
	   part of the list above. */
	tr.orphanrow td { background-color:rgba(192,57,43,0.07); }

	/* The LoxBerry jQuery Mobile theme has no red swatch, only a, b and c, and
	   its rule "html .ui-body-a .ui-btn" has one element and two classes - a
	   selector of two classes alone would lose against it. */
	html body .s4l-btn-danger.ui-btn,
	html body .s4l-btn-danger.ui-btn:visited
	{
		background	:#c0392b;
		border-color	:#a93226;
		color		:#ffffff;
		text-shadow	:none;
	}
	html body .s4l-btn-danger.ui-btn:hover,
	html body .s4l-btn-danger.ui-btn:focus
	{
		background	:#a93226;
		border-color	:#922b21;
		color		:#ffffff;
		text-shadow	:none;
	}
</style>

<!-- Where the Loxone configuration comes from (issue #101).
     Loxone occasionally produces a LoxPLAN this plugin cannot unpack or parse.
     A user can repair the XML by hand - manual mode is how the repaired file
     gets in. -->
<div style="display:flex;align-items:flex-end;flex-wrap:wrap;">
	<div style="padding:5px;">
	<fieldset data-role="controlgroup" data-type="horizontal" data-mini="true" class="s4l-filtergroup">
		<legend><TMPL_VAR SETTINGS.LABEL_LOXPLANSOURCE></legend>
		<input type="radio" name="loxplansource" id="loxplansource_auto" value="auto" checked="checked">
		<label for="loxplansource_auto"><span class="filter_icon"><TMPL_VAR SETTINGS.LABEL_LOXPLANSOURCE_AUTO></span></label>
		<input type="radio" name="loxplansource" id="loxplansource_manual" value="manual">
		<label for="loxplansource_manual"><span class="filter_icon"><TMPL_VAR SETTINGS.LABEL_LOXPLANSOURCE_MANUAL></span></label>
	</fieldset>
	</div>

	<!-- Greyed out while the configuration is fetched automatically -->
	<div style="padding:5px;" id="loxplanupload">
		<div class="uploadrow">
			<select name="upload_msno" id="upload_msno" data-mini="true"></select>
			<input type="file" name="loxplanfile" id="loxplanfile" accept=".Loxone,.xml,application/xml,text/xml">
			<a href="javascript:uploadLoxplan();" id="btnuploadloxplan" class="ui-btn ui-btn-b ui-btn-inline ui-mini ui-corner-all"><TMPL_VAR SETTINGS.BUTTON_UPLOAD_LOXPLAN></a>
		</div>
		<div class="hint small" id="loxplanupload_hint">&nbsp;</div>
	</div>
</div>
