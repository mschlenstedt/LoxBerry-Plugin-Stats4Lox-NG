	/* Status of a statistic: green fine, yellow the grabber ran out of time,
	   red the Miniserver does not know the block any more. A dot rather than
	   text so the column stays narrow; the wording is in the tooltip. */
	.statusdot
	{
		display		:inline-block;
		width		:14px;
		height		:14px;
		border-radius	:50%;
		vertical-align	:middle;
		border		:1px solid rgba(0,0,0,0.35);
	}
	.statusdot-green  { background-color:#3c9a3c; }
	.statusdot-yellow { background-color:#e0a800; }
	.statusdot-red    { background-color:#c0392b; }
	.statuscell       { text-align:center; white-space:nowrap; }
	.statuscell .statustext { font-size:smaller; display:block; margin-top:2px; }

	/* Statistics whose block is gone from the LoxPLAN. They have no row of
	   their own in Loxone Config, so the row is marked to make clear it is not
	   part of the list above. */
	tr.orphanrow td { background-color:rgba(192,57,43,0.07); }

	/* The LoxBerry jQuery Mobile theme has no red swatch, only a, b and c, and
	   its rule "html .ui-body-a .ui-btn" has one element and two classes - a
	   selector of two classes alone would lose against it. */
	html body .s4l-btn-danger.ui-btn,
	html body .s4l-btn-danger.ui-btn:visited
	{
		background	:#c0392b;
		border-color	:#a93226;
		color		:#ffffff;
		text-shadow	:none;
	}
	html body .s4l-btn-danger.ui-btn:hover,
	html body .s4l-btn-danger.ui-btn:focus
	{
		background	:#a93226;
		border-color	:#922b21;
		color		:#ffffff;
		text-shadow	:none;
	}
</style>
