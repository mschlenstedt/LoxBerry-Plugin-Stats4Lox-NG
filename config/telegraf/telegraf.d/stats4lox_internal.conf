# Collect statistics about itself
[[inputs.internal]]
  ## If true, collect telegraf memory stats.
  collect_memstats = true

# Error and byte counters as floats
#
# Telegraf sends these as integers, and integer is what they are. They are
# written as floats anyway, because that is what is already in the database:
# an identical conversion has been shipping in stats4lox_loxberry.conf for
# years - unscoped, so it caught these along the way.
#
# InfluxDB fixes a field's type per shard. The moment the conversion stopped,
# InfluxDB refused the integers - and it does not refuse the one field, it
# rejects the whole batch:
#
#   field type conflict: input field "gather_errors" on measurement
#   "internal_gather" is type integer, already exists as type float  dropped=7
#
# So Telegraf's entire internal statistics stopped arriving, including
# metrics_gathered, which is what the "Gathered Metrics per Hour" panel draws.
# Measured on 07.08.2026: gone from the very minute the other file was replaced.
#
# The globs are exactly the ones that are float in the database today - *_errors
# and *_bytes, and never the plain "errors", which has no underscore and is
# integer everywhere. namepass keeps it to the internal measurements; the old one
# applied to every metric passing through Telegraf.
[[processors.converter]]
  namepass = ["internal_*"]
  [processors.converter.fields]
    float = [
      "*_errors",
      "*_bytes",
    ]

[[outputs.file]]
  ## Files to write to, "stdout" is a specially handled file.
  files = ["/tmp/telegraf_internals.out"]

  ## Use batch serialization format instead of line based delimiting.  The
  ## batch format allows for the production of non line based output formats and
  ## may more efficiently encode and write metrics.
  # use_batch_format = false

  ## The file will be rotated after the time interval specified.  When set
  ## to 0 no time based rotation is performed.
  rotation_interval = "30s"

  ## The logfile will be rotated when it becomes larger than the specified
  ## size.  When set to 0 no size based rotation is performed.
  # rotation_max_size = "0MB"

  ## Maximum number of rotated archives to keep, any older logs are deleted.
  ## If set to -1, no archives are removed.
  rotation_max_archives = 1

  ## Data format to output.
  ## Each data format has its own unique set of configuration options, read
  ## more about them here:
  ## https://github.com/influxdata/telegraf/blob/master/docs/DATA_FORMATS_OUTPUT.md
  data_format = "influx"

  namepass = ["internal_*"]
