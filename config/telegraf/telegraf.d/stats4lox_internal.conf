# Collect statistics about itself
[[inputs.internal]]
  ## If true, collect telegraf memory stats.
  collect_memstats = true

# Where those statistics go: seven days, and only what is actually looked at
#
# The main output in telegraf.conf drops everything called internal_* - see the
# namedrop there - and this one picks it back up. Two reasons for the detour:
#
# The RETENTION. These are operating figures for three graphs on the Plugin Home
# dashboard, which shows the last 24 hours. A week is generous for that, and
# forever is what it used to be: a year of them was 9.9 million points, two
# thirds of the database on the test installation.
#
# And the SELECTION. Of the seven internal_ measurements Telegraf produces, the
# dashboard reads two: internal_write for Buffer Size and Buffer Fullness,
# internal_gather for Gathered Metrics per Hour. The other five are not lost -
# the plugin's own Home tab reads them from the files written below, not from the
# database - they simply stop being stored for nobody.
#
# The "internal" policy is created by bin/s4l_migrate_internals.pl. Its name does
# NOT start with s4l_, and that is deliberate: s4l_retention.pl drops every
# policy with that prefix which is not one of its own stages, data and all.
[[outputs.influxdb]]
  urls = ["https://127.0.0.1:8086"]
  database = "stats4lox"
  retention_policy = "internal"
  namepass = ["internal_gather", "internal_write"]
  skip_database_creation = true
  username = "${USER_INFLUXDB}"
  password = "${PASS_INFLUXDB}"
  insecure_skip_verify = true

[[outputs.file]]
  ## Files to write to, "stdout" is a specially handled file.
  files = ["/tmp/telegraf_internals.out"]

  ## Use batch serialization format instead of line based delimiting.  The
  ## batch format allows for the production of non line based output formats and
  ## may more efficiently encode and write metrics.
  # use_batch_format = false

  ## The file will be rotated after the time interval specified.  When set
  ## to 0 no time based rotation is performed.
  rotation_interval = "30s"

  ## The logfile will be rotated when it becomes larger than the specified
  ## size.  When set to 0 no size based rotation is performed.
  # rotation_max_size = "0MB"

  ## Maximum number of rotated archives to keep, any older logs are deleted.
  ## If set to -1, no archives are removed.
  rotation_max_archives = 1

  ## Data format to output.
  ## Each data format has its own unique set of configuration options, read
  ## more about them here:
  ## https://github.com/influxdata/telegraf/blob/master/docs/DATA_FORMATS_OUTPUT.md
  data_format = "influx"

  namepass = ["internal_*"]
