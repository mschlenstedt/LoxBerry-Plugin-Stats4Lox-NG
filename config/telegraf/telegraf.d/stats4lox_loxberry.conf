# Read formatted metrics from one or more HTTP endpoints
#
# This drop-in used to point Telegraf straight at Linfo with data_format = "json"
# and never had a URL to go to. It could not have worked as intended: Linfo
# answers with the whole system in one document, so that would have flattened all
# 38 mounts and 20 devices into fields, and json_name_key together with
# name_prefix would have made one measurement PER HOST rather than one series per
# host in one measurement.
#
# It goes through a grabber of ours now, like the Loxone and the Miniserver data:
# grabber_loxberry.cgi asks every configured LoxBerry, picks the values the user
# selected and answers in line protocol.
#
# The global [[processors.converter]] that used to sit at the end of this file
# went with it. It was written for the field names of that JSON approach, applied
# to every metric passing through Telegraf rather than to this input, and nothing
# produces those names any more.
[[inputs.http]]
  ## One or more URLs from which to read formatted metrics
  urls = [
    "http://localhost/admin/plugins/REPLACELBPPLUGINDIR/grabber/grabber_loxberry.cgi",
  ]

  ## Amount of time allowed to complete the HTTP request
  ##
  ## One request per configured LoxBerry, and a machine that is switched off is
  ## only found out about by waiting. 290 s is ten short of the shortest interval
  ## the page offers: however slow the answers, a round has to be over before the
  ## next one is due.
  timeout = "290s"

  ## Data format to consume.
  ## Each data format has its own unique set of configuration options, read
  ## more about them here:
  ## https://github.com/influxdata/telegraf/blob/master/docs/DATA_FORMATS_INPUT.md
  data_format = "influx"

  ## Interval
  ##
  ## Telegraf asks every minute; the grabber decides for itself whether the
  ## interval the user chose has come round.
  interval = "60s"
