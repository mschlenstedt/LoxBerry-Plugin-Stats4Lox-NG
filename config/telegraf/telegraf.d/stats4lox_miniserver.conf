# Read formatted metrics from one or more HTTP endpoints
[[inputs.http]]
  ## One or more URLs from which to read formatted metrics
  urls = [
    "http://localhost/admin/plugins/REPLACELBPPLUGINDIR/grabber/grabber_miniserver.cgi",
  ]

  ## Amount of time allowed to complete the HTTP request
  ##
  ## The grabber asks the Miniserver once per selected value - up to two dozen
  ## HTTP requests, and once more for every further Miniserver. Measured on a
  ## live installation: 2.7 s for one Miniserver with the full catalogue, so the
  ## five seconds this used to allow were already exceeded by the second one.
  ## Telegraf then throws away the WHOLE answer, not the part that was late.
  timeout = "30s"

  ## Data format to consume.
  ## Each data format has its own unique set of configuration options, read
  ## more about them here:
  ## https://github.com/influxdata/telegraf/blob/master/docs/DATA_FORMATS_INPUT.md
  data_format = "influx"

  ## Interval
  interval = "60s"
