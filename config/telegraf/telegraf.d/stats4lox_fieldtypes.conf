# Field types that must not change: these stay float
#
# This is a compatibility shim, not a design decision. It does what an identical
# converter has been doing since it was first shipped, and it has to keep doing
# it until the stored types are migrated - which InfluxQL cannot do.
#
# InfluxDB fixes a field's type per shard. If a field that is float in the
# database arrives as an integer, InfluxDB does not refuse that one field - it
# rejects the whole batch:
#
#   field type conflict: input field "gather_errors" on measurement
#   "internal_gather" is type integer, already exists as type float  dropped=7
#
# The measurement then simply stops, and nothing in the web interface says so.
# Exactly that happened on 07.08.2026: the converter used to live at the bottom
# of stats4lox_loxberry.conf, a drop-in that never worked and was replaced - and
# with it Telegraf's own statistics stopped arriving, which was noticed on a
# Grafana panel a day later.
#
# It has its own file now, because that is what it is: a rule about field types,
# not a detail of some input. A processor in Telegraf is GLOBAL wherever it is
# written; only namepass and fieldpass narrow it. Hiding one at the end of an
# unrelated file is how this went wrong.
#
# NOT narrowed to Telegraf's internal measurements, although those are the only
# ones that match on the test installation. Everything the plugin collects goes
# through here: Loxone statistics, and by way of lox2telegraf.pl and the socket
# listener everything the MQTT Collector receives. Those field names come from
# the user's topics and blocks - "rx_bytes" from a network device, "Load" from an
# inverter - and they have been float on every installation for years. Narrowing
# the globs would break whichever of them happens to arrive as an integer, on
# installations nobody here can look at.
#
# The globs are the original ones, unchanged, and they should only ever be
# REMOVED together with a migration of the data behind them.
[[processors.converter]]
  [processors.converter.fields]
    float = [
      "Load*",
      "*_bootedTimestamp",
      "*_bytes",
      "*_errors",
      "*_packets",
      "*_quality_*",
    ]
