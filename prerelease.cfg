[AUTOUPDATE]
# This file is used if you would like to provide automatic updates. Put
# this file into your repo and give a link to this file in your plugin.cfg
# If you would like to release an update, edit VERSION here and give
# the donwload link here

# Version of the new pre-release
# Has to be written exactly like VERSION in plugin.cfg - LoxBerry compares the
# two, and "1.0" against an installed "1.0.0" is not the same string.
VERSION=1.0.0

# Download URL of the ZIP Archive
ARCHIVEURL=https://github.com/mschlenstedt/LoxBerry-Plugin-Stats4Lox-NG/archive/refs/tags/V1.0.zip

# URL for further information about this release
INFOURL=https://github.com/mschlenstedt/LoxBerry-Plugin-Stats4Lox-NG/releases/tag/V1.0
